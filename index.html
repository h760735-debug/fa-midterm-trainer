 "Все три пункта — обязанности директоров (лекция 1, слайд 27). Плюс соблюдение законов и правил.");
Q("rg10","reg",2,"lec1","Which of the following best describes the main objectives of the IASB?",
 ["To raise the standard of financial reporting and eventually bring about global harmonisation of accounting standards","To audit the financial statements of listed companies","To collect taxes based on company profits","To set the company law of each country"],0,
 "Цели IASB: повысить качество отчётности и добиться **глобальной гармонизации** стандартов.");
Q("rg11","reg",2,"lec1","The IFRS Interpretations Committee has two main responsibilities. Which of the following is one of them?",
 ["To review, on a timely basis, newly identified financial reporting issues not specifically addressed in IFRSs","To appoint the members of the IASB and raise its funding","To audit companies that apply IFRSs","To approve national tax laws"],0,
 "IFRIC: (1) своевременно рассматривает новые проблемы, не описанные в IFRS; (2) разъясняет вопросы с противоречивыми толкованиями.");
Q("rg12","reg",2,"lec1","Why were accounting standards developed?",
 ["To reduce the subjectivity that arises when judgement is used in preparing financial statements","To make every company report the same profit","To replace the need for an audit","To allow directors to choose any accounting treatment they prefer"],0,
 "Многие цифры требуют суждения, отсюда субъективность. Стандарты её **уменьшают** и повышают сопоставимость (comparability).");
Q("rg13","reg",2,"kap","During the development of a new IFRS, the IASB publishes a draft version of the intended standard for public comment. This is called:",
 ["An exposure draft","A discussion paper","An IFRIC interpretation","A conceptual framework"],0,
 "**Exposure draft** — проект стандарта для публичных комментариев. Discussion paper — более ранний документ для обсуждения идей.");
Q("rg14","reg",1,"lec1","In a company, those charged with governance are usually:",
 ["The board of directors","The external auditors","The shareholders","The finance department staff"],0,
 "**Board of directors** — высшее руководство, «those charged with governance».");
Q("rg15","reg",3,"kap","Which body, formed in 2021 under the IFRS Foundation, develops sustainability-related disclosure standards?",
 ["The International Sustainability Standards Board (ISSB)","The IFRS Advisory Council","The IFRS Interpretations Committee","The International Accounting Standards Board (IASB)"],0,
 "**ISSB** (2021) — стандарты раскрытия информации об устойчивом развитии. Есть в учебнике Kaplan, гл. 2.");

/* ---------- 3. Concepts & qualitative characteristics ---------- */
Q("cn01","concepts",1,"rev","Items with monetary values are included in the accounts. Which accounting concept is being applied?",
 ["Business entity concept","Money measurement concept","Time period concept","Going concern concept"],1,
 "**Money measurement**: в учёт попадает только то, что можно выразить в деньгах.");
Q("cn02","concepts",1,"rev","A business prepares its accounts on the basis that it will continue to trade in the foreseeable future. Which accounting principle is being applied?",
 ["Business entity","Time period concept","Going concern concept","Matching concept"],2,
 "**Going concern** — допущение, что бизнес продолжит работу в обозримом будущем (обычно не меньше 12 месяцев).");
Q("cn03","concepts",1,"rev","The owner of a business takes goods from inventory for their own personal use. Which accounting concept should be considered?",
 ["The fair presentation concept","The business entity concept","The accruals concept","The going concern concept"],1,
 "**Business entity**: бизнес отделён от владельца, поэтому личное изъятие товаров учитывается как drawings, а не как расход бизнеса.");
Q("cn04","concepts",1,"rev","Which one of the following is NOT a qualitative characteristic of financial information?",
 ["Faithful representation","Relevance","Timeliness","Money measurement concept"],3,
 "Money measurement — это **концепция** учёта, а не качественная характеристика. QCs: relevance, faithful representation, comparability, verifiability, timeliness, understandability.");
Q("cn05","concepts",2,"sem1","Mansura thinks her business will be worth more when she takes on new, highly skilled staff. Which accounting concept prevents her from recording this in her balance sheet?",
 ["Accounting entity","Time period / accounting period","Going concern","Money measurement"],3,
 "Квалификацию персонала нельзя надёжно измерить в деньгах, поэтому **money measurement** не позволяет её отразить.");
Q("cn06","concepts",1,"sem1","The cost of the owner's personal use of the motor car is excluded from the motor car expenses of the business. Which principle is being applied?",
 ["Accounting entity / business entity","Time period","Going concern","Money measurement"],0,
 "Личные расходы владельца — не расходы бизнеса: **business (accounting) entity**.");
Q("cn07","concepts",1,"sem1","An organisation should report its financial results within certain designated periods of time. Identify the accounting concept.",
 ["The business entity concept","The going concern concept","Time period assumption","Monetary unit assumption"],2,
 "**Time period** (periodicity): отчётность за регулярные периоды, обычно 12 месяцев.");
Q("cn08","concepts",1,"rev","When charging depreciation, which of the following concepts is applied?",
 ["Prudence","Matching","Consistency","Going concern"],1,
 "Амортизация распределяет стоимость актива на периоды, в которых он приносит доход: **matching**.");
Q("cn09","concepts",1,"rev","Which accounting concept is applied when a company creates a provision for doubtful debts (allowance for receivables)?",
 ["Accrual concept","Going concern concept","Prudence (conservatism) concept","Consistency concept"],2,
 "**Prudence**: вероятные убытки признаём сразу, не завышаем активы и прибыль.");
Q("cn10","concepts",1,"lec4","Once a business has chosen FIFO to value its inventory, it should keep using FIFO in later periods unless there is a valid reason to change. Which concept is this?",
 ["Consistency","Prudence","Historic cost","Going concern"],0,
 "**Consistency**: одни и те же учётные политики из периода в период, чтобы отчётность была сопоставимой.");
Q("cn11","concepts",1,"lec4","Assets are initially recorded at their original purchase cost rather than at their current market value. Which concept is this?",
 ["Historic cost","Money measurement","Going concern","Matching"],0,
 "**Historic cost**: первоначальная стоимость (цена покупки + прямые затраты на доставку и подготовку к использованию).");
Q("cn12","concepts",1,"lec2","All transactions should be recorded using verifiable, unbiased evidence such as invoices and receipts, rather than personal opinions. Which concept is this?",
 ["Objectivity","Duality","Prudence","Time period"],0,
 "**Objectivity**: записи на основе проверяемых документов, а не мнений.");
Q("cn13","concepts",1,"lec2","Every transaction affects at least two elements of the accounting equation. Which concept is this?",
 ["Duality (dual aspect)","Business entity","Consistency","Going concern"],0,
 "**Duality** — основа двойной записи: у каждой операции два эффекта.");
Q("cn14","concepts",1,"lec1","Faithful representation means that financial information is:",
 ["Complete, neutral and free from material error","Available to users as soon as possible","Comparable with other entities","Presented clearly and concisely"],0,
 "Faithful representation = **complete + neutral + free from material error**. Остальные варианты — timeliness, comparability, understandability.");
Q("cn15","concepts",1,"lec1","Information is more useful if it can be compared with similar information about other entities and about the same entity for another period. Which qualitative characteristic is this?",
 ["Comparability","Verifiability","Relevance","Neutrality"],0,
 "**Comparability** — сопоставимость с другими компаниями и с прошлыми периодами.");
Q("cn16","concepts",2,"lec1","Which of the following are qualitative characteristics of useful financial information?\n1 Relevance\n2 Going concern\n3 Verifiability\n4 Timeliness",
 ["1, 2 and 3 only","1, 3 and 4 only","2 and 4 only","1, 2, 3 and 4"],1,
 "Going concern — концепция (assumption), а не качественная характеристика. Relevance, verifiability и timeliness — QCs.");
Q("cn17","concepts",1,"lec5","'Do not anticipate profits, but provide for all possible losses' is the traditional summary of which concept?",
 ["Prudence (conservatism)","Matching","Consistency","Money measurement"],0,
 "**Prudence**: убытки признаём сразу, прибыль — только когда она получена.");
Q("cn18","concepts",2,"new","A company is expected to be liquidated within the next few months. Which concept can no longer be applied when preparing its financial statements?",
 ["Going concern","Business entity","Money measurement","Duality"],0,
 "Если бизнес не продолжит работу, нарушено допущение **going concern**: активы оценивают иначе (например, по стоимости при ликвидации).");
Q("cn19","concepts",1,"lec1","Financial information is unbiased and does not favour any particular user group over another. This describes:",
 ["Neutrality","Timeliness","Understandability","Comparability"],0,
 "**Neutrality** — часть faithful representation: информация непредвзята.");
Q("cn20","concepts",2,"lec1","Information that does not help users to make decisions lacks which qualitative characteristic?",
 ["Relevance","Verifiability","Comparability","Faithful representation"],0,
 "**Relevance**: информация влияет на решения пользователей. Бесполезная для решений информация — irrelevant.");

/* ---------- 4. Documents & books of prime entry ---------- */
Q("dc01","docs",1,"rev","Which of the following is/are NOT a book of prime entry?\n1 Sales day book\n2 Cash book\n3 Journal\n4 Purchase ledger",
 ["1, 2 and 3 only","1, 2 and 4 only","3 and 4 only","4 only"],3,
 "Purchase ledger — книга **счетов** (ledger), а не книга первичной записи. Sales day book, cash book и journal — books of prime entry.");
Q("dc02","docs",1,"rev","Which book of prime entry is used to record the purchase of a non-current asset for cash?",
 ["The journal","The cash book","The purchase day book","The sales day book"],1,
 "Все операции с деньгами идут в **cash book**. В journal — покупка внеоборотного актива **в кредит**.");
Q("dc03","docs",1,"rev","A sales day book records which of the following?",
 ["Cash received","Trade discounts","Credit notes received","Sales invoices"],3,
 "Sales day book — список выставленных **sales invoices** по продажам в кредит.");
Q("dc04","docs",2,"rev","Which document should be sent with goods that are being returned to a supplier?",
 ["Invoice","Debit note","Credit note","Statement of account"],1,
 "Покупатель, возвращая товар, отправляет **debit note** (просит уменьшить долг). Поставщик в ответ выписывает credit note.");
Q("dc05","docs",1,"rev","Which transaction is recorded in the general journal?",
 ["Cash paid to suppliers","Cash received from a customer","Machinery bought on credit","Inventory bought on credit"],2,
 "Покупка внеоборотного актива **в кредит** — в journal. Денежные операции — cash book, покупка товара в кредит — purchase day book.");
Q("dc06","docs",2,"rev","Which of the following statements is/are FALSE?\n1 Cash purchases are recorded in the purchases day book.\n2 The sales day book is used to keep a list of invoices received from suppliers.",
 ["Both statements are TRUE","Both statements are FALSE","Statement 1 is TRUE and statement 2 is FALSE","Statement 1 is FALSE and statement 2 is TRUE"],1,
 "1 ложно: покупки за наличные идут в cash book. 2 ложно: в sales day book — счета, выставленные покупателям; счета от поставщиков — в purchase day book.");
Q("dc07","docs",2,"sem2","In which book of prime entry will a business record debit notes in respect of goods which have been sent back to suppliers?",
 ["The sales returns day book","The cash book","The purchase returns day book","The purchase day book"],2,
 "Возвраты поставщикам (returns outwards) — **purchase returns day book**.");
Q("dc08","docs",1,"sem2","X invoices goods to Y. They are found to be damaged. Which document will X then send to Y?",
 ["Invoice","Debit note","Credit note","Statement of account"],2,
 "Поставщик (X) уменьшает долг покупателя и выписывает **credit note**.");
Q("dc09","docs",1,"sem2","Which of the following is NOT a book of prime (original) entry?",
 ["Sales invoice","Sales day book","Purchase day book","Journal"],0,
 "Sales invoice — **первичный документ** (source document), а не книга.");
Q("dc10","docs",1,"sem2","Which book of prime entry is used to record payments of small amounts of cash?",
 ["Cash book","Petty cash book","Purchase day book","Journal"],1,
 "Мелкие наличные расходы — **petty cash book**.");
Q("dc11","docs",1,"ws2","You receive an invoice from A Brown, a supplier, for $300 of goods bought on credit. Where is it first recorded?",
 ["Purchases day book","Sales day book","Cash book","Purchase returns day book"],0,
 "Счёт от поставщика за покупку в кредит — **purchases day book**.");
Q("dc12","docs",1,"ws2","Jones, a customer, returns goods with a value of $250. Where is this first recorded?",
 ["Sales returns day book","Purchase returns day book","Sales day book","Cash book"],0,
 "Возврат от покупателя (returns inwards) — **sales returns day book** (на основании выданной credit note).");
Q("dc13","docs",2,"lec2","A goods received note (GRN) is:",
 ["Produced by the business receiving the goods as proof of receipt, and matched with the delivery note and purchase order","Sent by the supplier with the goods, listing what has been delivered","Issued by the supplier to request payment","Sent by the buyer to tell the seller that an invoice has been paid"],0,
 "GRN делает **получатель** товара. Второй вариант — delivery note, третий — invoice, четвёртый — remittance advice.");
Q("dc14","docs",1,"lec2","Which document is sent by a buyer to a seller to inform the seller that an invoice has been paid?",
 ["Remittance advice","Statement","Receipt","Purchase order"],0,
 "**Remittance advice** — уведомление об оплате: какие счета оплачены.");
Q("dc15","docs",1,"lec2","Which document is issued by a supplier and shows the invoices, payments and the amount still owing?",
 ["Statement","Credit note","Delivery note","Goods received note"],0,
 "**Statement** (of account) — выписка поставщика с остатком долга.");
Q("dc16","docs",1,"lec2","Writing off an irrecoverable (bad) debt is first recorded in:",
 ["The journal","The sales day book","The cash book","The sales returns day book"],0,
 "Списание безнадёжного долга, исправление ошибок, покупка и продажа внеоборотных активов в кредит, вступительные записи — **journal**.");
Q("dc17","docs",1,"ws2","Cash sales are first recorded in:",
 ["The cash book","The sales day book","The journal","The sales ledger"],0,
 "Sales day book — только продажи **в кредит**. Продажи за наличные — **cash book**.");
Q("dc18","docs",1,"lec2","Which document is issued by the seller as a request for payment?",
 ["Invoice","Debit note","Purchase order","Remittance advice"],0,
 "**Invoice** — требование оплаты от продавца (у продавца это sales invoice, у покупателя — purchase invoice).");
Q("dc19","docs",2,"bpp","A business operates an imprest system for petty cash with a float of $200. During the week, payments of $146 were made from petty cash. How much cash is needed to restore the float at the end of the week?",
 ["$146","$200","$54","$346"],0,
 "Imprest system: в конце периода пополняют ровно на сумму потраченного — **$146**, чтобы снова было $200.");

/* ---------- 5. Accounting equation & capital ---------- */
Q("eq01","equation",2,"rev","Identify the correct form of the accounting equation.",
 ["Assets + profit − drawings − liabilities = closing capital","Assets − liabilities − drawings = opening capital + profit","Assets − liabilities − opening capital + drawings = profit","Assets − profit − drawings = closing capital − liabilities"],2,
 "Assets − liabilities = closing capital = opening capital + profit − drawings. Переносим: **assets − liabilities − opening capital + drawings = profit**.");
Q("eq02","equation",2,"rev","The profit made by a business in 2017 was $35,400. The proprietor injected new capital of $10,200 during the year and withdrew goods for his private use which had cost $6,000. If net assets at the beginning of 2017 were $95,100, what were the closing net assets?",
 ["$55,500","$134,700","$50,000","$49,500"],1,
 "Closing NA = opening + capital introduced + profit − drawings = 95,100 + 10,200 + 35,400 − 6,000 = **$134,700**.");
Q("eq03","equation",2,"rev","A business can make a profit and yet have a reduction in its bank balance. Which ONE of the following might cause this to happen?",
 ["The sale of non-current assets at a loss","The charging of depreciation in the statement of profit or loss","The lengthening of the period of credit given to customers","The lengthening of the period of credit taken from suppliers"],2,
 "Если покупателям дают **дольше платить**, деньги приходят позже: прибыль есть, а денег в банке меньше. Амортизация не тратит деньги; продажа актива даже с убытком приносит деньги; если мы дольше платим поставщикам, денег больше.");
Q("eq04","equation",2,"rev","The net assets of Mansur, a trader, at 1 January 2002 amounted to $128,000. During the year Mansur introduced a further $50,000 of capital and made drawings of $48,000. At 31 December 2002 Mansur's net assets were $184,000. What is Mansur's profit or loss for the year?",
 ["$54,000 profit","$54,000 loss","$42,000 loss","$58,000 profit"],0,
 "Profit = closing NA − opening NA − capital introduced + drawings = 184,000 − 128,000 − 50,000 + 48,000 = **$54,000 profit**.");
Q("eq05","equation",2,"sem2","A trader's net profit for the year may be computed by using which of the following formulae?",
 ["Opening capital + drawings − capital introduced − closing capital","Closing capital + drawings − capital introduced − opening capital","Opening capital − drawings + capital introduced − closing capital","Opening capital − drawings − capital introduced − closing capital"],1,
 "Прирост капитала = прибыль + новый капитал − изъятия. Значит **profit = closing − opening + drawings − capital introduced**.");
Q("eq06","equation",3,"sem2","The profit made by a business in 2017 was $35,400. The proprietor injected new capital of $10,200 during the year and withdrew a monthly salary of $500. If net assets at the end of 2017 were $95,100, what was the proprietor's capital at the beginning of the year?",
 ["$55,500","$59,700","$50,000","$49,500"],0,
 "Drawings = 500 × 12 = 6,000. Opening = closing − profit − new capital + drawings = 95,100 − 35,400 − 10,200 + 6,000 = **$55,500**.");
Q("eq07","equation",1,"sem3","Which of the following is correct?",
 ["Profit does not alter capital","A loss reduces capital","Capital can only come from profit","Profit decreases capital"],1,
 "Прибыль увеличивает капитал, **убыток уменьшает**.");
Q("eq08","equation",1,"sem2","A business purchases $800 of inventory on credit. What is the effect on the accounting equation?",
 ["Assets increase by $800 and liabilities increase by $800","Assets increase by $800 and capital increases by $800","Assets decrease by $800 and liabilities increase by $800","No effect, because no cash was paid"],0,
 "Запасы (asset) +800, долг поставщику (liability) +800. Уравнение остаётся в балансе.");
Q("eq09","equation",1,"sem2","A business pays its telephone bill of $25 in cash. What is the effect on the accounting equation?",
 ["Assets decrease by $25 and capital decreases by $25","Assets decrease by $25 and liabilities decrease by $25","Assets increase by $25 and capital decreases by $25","Liabilities increase by $25 and capital decreases by $25"],0,
 "Деньги (asset) −25; расход уменьшает прибыль, а значит и **капитал** −25.");
Q("eq10","equation",2,"sem2","Inventory which cost $450 is sold for $650 cash. What is the overall effect on the accounting equation?",
 ["Assets increase by $200 and capital increases by $200","Assets increase by $650 and capital increases by $650","Assets increase by $200 and liabilities increase by $200","Assets increase by $650 and liabilities increase by $450"],0,
 "Запасы −450, деньги +650 → активы **+200**. Прибыль 200 увеличивает капитал.");
Q("eq11","equation",2,"ws2","The owner pays a business creditor using private money from outside the firm. What is the effect on the business's accounting equation?",
 ["Liabilities decrease and capital increases","Assets decrease and liabilities decrease","Assets decrease and capital decreases","No effect, because business money was not used"],0,
 "Долг бизнеса уменьшился, а владелец фактически вложил свои деньги: **liabilities ↓, capital ↑**.");
Q("eq12","equation",1,"ws2","The owner takes money out of the business bank account for personal use. What is the effect?",
 ["Assets decrease and capital decreases","Assets decrease and liabilities decrease","Assets decrease and expenses increase","Capital increases and assets decrease"],0,
 "Drawings: деньги (asset) уменьшаются, **капитал уменьшается**. Это не расход бизнеса.");
Q("eq13","equation",1,"lec2","Which of the following is NOT an expense?",
 ["Drawings","Depreciation","Discounts allowed","Irrecoverable debts"],0,
 "**Drawings** — изъятия владельца: уменьшают капитал, но в P&L не попадают.");
Q("eq14","equation",1,"lec2","Which of the following is income (revenue) of a business?",
 ["Discounts received","Discounts allowed","Capital introduced","A bank loan received"],0,
 "**Discounts received** — доход (скидка от поставщика). Discounts allowed — расход; капитал и кредит — не доход.");
Q("eq15","equation",1,"zero","A business has assets of $85,000 and liabilities of $27,500. What is the owner's capital?",
 ["$57,500","$112,500","$27,500","$85,000"],0,
 "Capital = assets − liabilities = 85,000 − 27,500 = **$57,500**.");
Q("eq16","equation",2,"zero","John invested $5,000 cash in his business, then borrowed $2,000 from Edward, and then bought goods for resale for $1,000 cash. What are the total assets of the business now?",
 ["$7,000","$8,000","$6,000","$5,000"],0,
 "Cash 5,000 + 2,000 − 1,000 = 6,000; inventory 1,000 → assets **$7,000** = liabilities 2,000 + capital 5,000.");
Q("eq17","equation",2,"ws2","The owner takes goods costing $300 from inventory for personal use. What is the effect on the accounting equation?",
 ["Assets decrease by $300 and capital decreases by $300","Assets decrease by $300 and expenses increase by $300","Capital increases by $300 and assets decrease by $300","No effect, because no cash is involved"],0,
 "Запасы (asset) −300, drawings уменьшают **капитал** −300.");

/* ---------- 6. Double entry ---------- */
Q("de01","double",2,"rev","James has the following transactions:\n1 Receipt of cash from a customer in respect of an invoice for goods sold three weeks ago\n2 Receipt of cash from a second customer for cash sales\nWhat are the ledger entries required to record the above transactions?",
 ["Dr Cash; Cr Sales","Dr Cash; Cr Sales; Cr Trade receivables","Dr Sales; Cr Cash","Dr Trade receivables; Dr Sales; Cr Cash"],1,
 "1: Dr Cash / Cr Trade receivables (покупатель гасит долг). 2: Dr Cash / Cr Sales (продажа за наличные). Вместе: **Dr Cash, Cr Sales, Cr Trade receivables**.");
Q("de02","double",2,"rev","A business sells $5,250 worth of goods to a customer; the customer pays $4,500 in cash immediately and will pay the remaining $750 in 30 days' time. What is the double entry in the seller's accounting records?",
 ["Debit sales $5,250, Credit receivables $750, Credit cash $4,500","Debit cash $4,500, Credit sales $4,500","Debit cash $4,500, Debit receivables $750, Credit sales $5,250","Debit cash $4,500, Debit payables $750, Credit sales $5,250"],2,
 "Продажа на всю сумму: **Cr Sales 5,250**. Получено сразу: Dr Cash 4,500; остаток в долг: Dr Receivables 750.");
Q("de03","double",2,"sem2","A business buys $100 worth of goods from a supplier. It pays $50 in cash immediately and will pay the remaining $50 in 30 days' time. What is the double entry in the buyer's accounting records?",
 ["Debit cash $50, credit payables $50, credit purchases $50","Debit payables $50, debit cash $50, credit purchases $100","Debit purchases $100, credit payables $50, credit cash $50","Debit purchases $100, credit cash $100"],2,
 "Покупатель: **Dr Purchases 100**; Cr Cash 50 (оплачено) и Cr Payables 50 (долг поставщику).");
Q("de04","double",1,"sem2","A credit entry may signify:",
 ["An increase in a liability account","A decrease in a liability account","An increase in an asset account","An increase in an expense account"],0,
 "Кредит **увеличивает** liabilities, capital и income; уменьшает assets и expenses.");
Q("de05","double",2,"sem2","Which of the following are correct?\n(i) Assets: an increase is a debit, a decrease is a credit\n(ii) Capital: an increase is a debit, a decrease is a credit\n(iii) Liabilities: an increase is a credit, a decrease is a debit",
 ["(i) and (ii)","(ii) and (iii)","(i) and (iii)","(i), (ii) and (iii)"],2,
 "Капитал увеличивается по **кредиту**, а не по дебету, поэтому (ii) неверно.");
Q("de06","double",1,"sem3","What are the correct ledger entries to record the acquisition of a building on credit?",
 ["Dr Building, Cr Accounts receivable","Dr Accounts payable, Cr Building","Dr Building, Cr Accounts payable","Dr Building, Cr Cash"],2,
 "Актив растёт (**Dr Building**), появляется долг (**Cr Payables**). Cash не затронут: покупка в кредит.");
Q("de07","double",1,"sem3","Which of the following should NOT be recorded in the 'Sales' account?",
 ["Office furniture sold","Goods sold on credit","Goods sold for cash","Sale of items previously included in 'Purchases'"],0,
 "Sales — только продажа товаров, которыми торгует бизнес. Продажа офисной мебели — выбытие внеоборотного актива (disposal).");
Q("de08","double",2,"sem2","The proprietor paid a credit supplier, B Burt, from his private funds. What is the double entry?",
 ["Dr B Burt (payables); Cr Capital","Dr Capital; Cr B Burt (payables)","Dr B Burt (payables); Cr Bank","Dr Drawings; Cr B Burt (payables)"],0,
 "Долг поставщику уменьшается (Dr Payables). Владелец вложил свои деньги: **Cr Capital**. Деньги бизнеса не тратились.");
Q("de09","double",1,"sem2","Goods bought on credit are returned to the supplier, Timeless Ltd. What is the double entry?",
 ["Dr Timeless Ltd (payables); Cr Purchase returns","Dr Purchase returns; Cr Timeless Ltd (payables)","Dr Sales returns; Cr Timeless Ltd (payables)","Dr Timeless Ltd (payables); Cr Sales"],0,
 "Долг поставщику уменьшается (Dr Payables), возврат покупок — **Cr Purchase returns** (returns outwards).");
Q("de10","double",2,"sem2","A business sends out a credit note for $200 to a customer for goods returned. What is the double entry?",
 ["Dr Sales returns $200; Cr Trade receivables $200","Dr Trade receivables $200; Cr Sales returns $200","Dr Trade payables $200; Cr Purchase returns $200","Dr Sales $200; Cr Cash $200"],0,
 "Возврат от покупателя: **Dr Sales returns** (returns inwards); долг покупателя уменьшается — Cr Receivables.");
Q("de11","double",2,"sem2","A business buys a machine on credit for $8,000. What is the double entry?",
 ["Dr Machine $8,000; Cr Sundry payables $8,000","Dr Purchases $8,000; Cr Trade payables $8,000","Dr Machine $8,000; Cr Bank $8,000","Dr Sundry payables $8,000; Cr Machine $8,000"],0,
 "Внеоборотный актив: Dr Machine. Поставщики внеоборотных активов — **sundry payables**, а не trade payables (те для товаров на перепродажу).");
Q("de12","double",2,"new","The owner takes goods costing $300 for personal use. What is the double entry?",
 ["Dr Drawings $300; Cr Purchases $300","Dr Purchases $300; Cr Drawings $300","Dr Drawings $300; Cr Sales $300","Dr Expenses $300; Cr Inventory $300"],0,
 "Изъятие товаров: **Dr Drawings, Cr Purchases** (уменьшаем покупки, ведь этот товар не будет продан).");
Q("de13","double",2,"sem3","A customer settles a debt and is allowed a discount of $50. What is the double entry for the discount?",
 ["Dr Discounts allowed $50; Cr Trade receivables $50","Dr Trade receivables $50; Cr Discounts allowed $50","Dr Trade payables $50; Cr Discounts received $50","Dr Discounts received $50; Cr Trade receivables $50"],0,
 "Скидка покупателю — расход: **Dr Discounts allowed**; долг покупателя уменьшается — Cr Receivables.");
Q("de14","double",2,"sem3","A business pays a supplier and is given a discount of $80. What is the double entry for the discount?",
 ["Dr Trade payables $80; Cr Discounts received $80","Dr Discounts received $80; Cr Trade payables $80","Dr Discounts allowed $80; Cr Trade payables $80","Dr Trade payables $80; Cr Bank $80"],0,
 "Скидка от поставщика — доход: **Cr Discounts received**; долг поставщику уменьшается — Dr Payables.");
Q("de15","double",1,"sem2","Wages of $4,000 are paid by cheque. What is the double entry?",
 ["Dr Wages $4,000; Cr Bank $4,000","Dr Bank $4,000; Cr Wages $4,000","Dr Wages $4,000; Cr Capital $4,000","Dr Capital $4,000; Cr Bank $4,000"],0,
 "Расход растёт: **Dr Wages**; деньги уменьшаются: **Cr Bank**.");
Q("de16","double",2,"new","Which of the following accounts normally have a DEBIT balance?\n1 Drawings\n2 Discounts received\n3 Trade receivables\n4 Bank loan",
 ["1 and 3 only","2 and 4 only","1, 3 and 4 only","1 and 2 only"],0,
 "Дебетовое сальдо: активы, расходы, drawings. Discounts received (доход) и bank loan (обязательство) — кредитовое.");
Q("de17","double",1,"sem2","A business raises a loan of $1,000 from the bank. What is the double entry?",
 ["Dr Bank $1,000; Cr Bank loan $1,000","Dr Bank loan $1,000; Cr Bank $1,000","Dr Bank $1,000; Cr Capital $1,000","Dr Bank $1,000; Cr Sales $1,000"],0,
 "Деньги пришли: Dr Bank; появилось обязательство: **Cr Bank loan**. Кредит — не доход.");
Q("de18","double",1,"new","A business receives $60 of interest from its bank. What is the double entry?",
 ["Dr Bank $60; Cr Interest received $60","Dr Interest received $60; Cr Bank $60","Dr Bank $60; Cr Bank loan $60","Dr Bank $60; Cr Capital $60"],0,
 "Деньги растут (Dr Bank); полученные проценты — доход (**Cr Interest received**).");
Q("de19","double",2,"sem3","Goods are bought for $500, half for cash and half on credit. What is the double entry?",
 ["Dr Purchases $500; Cr Cash $250; Cr Trade payables $250","Dr Purchases $250; Dr Trade payables $250; Cr Cash $500","Dr Cash $250; Dr Trade payables $250; Cr Purchases $500","Dr Purchases $500; Cr Cash $500"],0,
 "Покупки на 500: **Dr Purchases 500**; оплачено 250 → Cr Cash, 250 в долг → Cr Trade payables.");

/* ---------- 7. Ledger accounts & trial balance ---------- */
Q("lg01","ledger",1,"rev","A trial balance is made up of a list of debit balances and credit balances. Which of the following statements is correct?",
 ["Every debit balance represents an expense","Assets are represented by credit balances","Liabilities are represented by credit balances","Income is included in the list of debit balances"],2,
 "Liabilities, capital и income — **кредитовые** сальдо. Assets, expenses и drawings — дебетовые.");
Q("lg02","ledger",2,"rev","A company's Vehicles at cost account at 30 June 2022 is shown below. What opening balance should be included in the following period's trial balance for vehicles at cost at 1 July 2022?",
 ["$20,500 Dr","$40,500 Dr","$30,500 Cr","$30,500 Dr"],3,
 "Balance c/d 30,500 стоит на кредитной стороне, значит b/d на 1 July 2022 — на дебете: **$30,500 Dr** (актив — дебетовое сальдо).",
 {tbl:{h:["Dr","$","Cr","$"],r:[["1 Jul 2021 Balance b/d","20,500","Disposal","10,000"],["Additions","20,000","30 Jun 2022 Balance c/d","30,500"],["","40,500","","40,500"]],t:1}});
Q("lg03","ledger",2,"sem3","Look at the Vehicles at cost account below. What was the balance for vehicles at cost in the trial balance at 1 July 2021?",
 ["$40,500 Dr","$20,500 Dr","$30,500 Cr","$30,500 Dr"],1,
 "Balance b/d на 1 July 2021 = **$20,500 Dr**: это сальдо на начало периода.",
 {tbl:{h:["Dr","$","Cr","$"],r:[["1 Jul 2021 Balance b/d","20,500","Disposal","10,000"],["Additions","20,000","30 Jun 2022 Balance c/d","30,500"],["","40,500","","40,500"]],t:1}});
Q("lg04","ledger",2,"rev","The trade payables account of a business for 2025 is shown below. What was the balance for trade payables in the trial balance at 31 December 2024?",
 ["$24,300 Dr","$24,300 Cr","$12,800 Dr","$12,800 Cr"],1,
 "Balance b/d на 1 Jan 2025 = закрывающее сальдо на 31 Dec 2024: **$24,300 Cr** (обязательство — кредитовое сальдо). $12,800 — сальдо уже на 31 Dec 2025.",
 {tbl:{h:["Dr","$","Cr","$"],r:[["Cash at bank","31,500","1 Jan 2025 Balance b/d","24,300"],["31 Dec 2025 Balance c/d","12,800","Purchases","20,000"],["","44,300","","44,300"]],t:1}});
Q("lg05","ledger",1,"sem3","Which of the following best describes a trial balance?",
 ["It shows the financial position of a business","It is a special account","It shows all the entries in the books","It is a list of balances on the books"],3,
 "Trial balance — **список сальдо** всех счетов на дату. Финансовое положение показывает statement of financial position.");
Q("lg06","ledger",1,"lec3","What is the main purpose of a trial balance?",
 ["To check the arithmetical accuracy of the double entry, i.e. that total debits equal total credits","To prove that there are no errors in the accounting records","To show the profit for the period","To record transactions for the first time"],0,
 "TB проверяет **арифметику** (Dr = Cr). Он не доказывает отсутствие ошибок: некоторые ошибки его не нарушают.");
Q("lg07","ledger",2,"new","Which of the following balances would appear on the CREDIT side of a trial balance?",
 ["Allowance for receivables","Drawings","Carriage inwards","Irrecoverable debts"],0,
 "**Allowance for receivables** — кредитовое сальдо (контр-актив). Drawings, carriage inwards и irrecoverable debts — дебетовые.");
Q("lg08","ledger",2,"new","Which of the following balances would appear on the DEBIT side of a trial balance?",
 ["Returns inwards (sales returns)","Returns outwards (purchase returns)","Discounts received","Accumulated depreciation"],0,
 "**Returns inwards** уменьшают продажи, поэтому сальдо дебетовое. Returns outwards, discounts received и accumulated depreciation — кредитовые.");
Q("lg09","ledger",2,"lec3","James's Cash at bank account for January has debit entries of $10,000 and $1,500, and credit entries of $4,000, $2,000, $800 and $200. What is the balance brought down on 1 February?",
 ["$4,500 Dr","$4,500 Cr","$11,500 Dr","$7,000 Cr"],0,
 "Дебет 11,500 − кредит 7,000 = 4,500. Balance c/d пишем на меньшей (кредитной) стороне, а b/d — на дебете: **$4,500 Dr**.");
Q("lg10","ledger",3,"sem3","Jerry's ledger balances at 31 January are: Bank $6,500; Capital $7,000; Bank loan $1,000; Purchases $5,000; Rent $3,500; Shop fittings $2,000; Sales $12,500; Loan interest $100; Other expenses $1,900; Drawings $1,500. What are the trial balance totals?",
 ["$20,500","$19,000","$22,000","$41,000"],0,
 "Dr: 6,500 + 5,000 + 3,500 + 2,000 + 100 + 1,900 + 1,500 = **20,500**. Cr: 7,000 + 1,000 + 12,500 = **20,500**. Drawings — на дебете!");
Q("lg11","ledger",3,"sem3","At 30 March the cash at bank balance is $9,700. The following transactions are then recorded: (a) goods bought for $500, half for cash and half on credit; (b) goods sold for $6,000, of which $2,000 was on credit; (c) loan interest of $700 paid by cheque. All cash goes through the bank account. What is the new cash at bank balance?",
 ["$12,750","$14,750","$12,500","$13,450"],0,
 "9,700 − 250 (половина покупки) + 4,000 (продажи за деньги) − 700 (проценты) = **$12,750**.");
Q("lg12","ledger",3,"ws5","A trial balance totals $47,420 on each side. The following are then recorded: goods bought for $500 (half paid from the bank, half on credit); goods sold for $6,000 ($2,000 on credit, the rest received into the bank); loan interest of $700 paid from the bank. What will the trial balance totals be after these transactions?",
 ["$53,670","$47,420","$53,420","$54,370"],0,
 "Dr: purchases +500, bank +3,050 (−250 +4,000 −700), receivables +2,000, interest +700 = +6,250. Cr: sales +6,000, payables +250 = +6,250. Итого 47,420 + 6,250 = **$53,670**.");
Q("lg13","ledger",1,"lec3","When an account is balanced off, the balance carried down (c/d) is entered on the side with the smaller total. Where is the balance brought down (b/d) entered?",
 ["On the opposite side, below the totals, at the start of the next period","On the same side as the balance c/d","Only in the trial balance, not in the account","On the side with the smaller total, above the totals"],0,
 "b/d пишут на **противоположной** стороне (где сумма больше), под итогами: это сальдо на начало следующего периода.");
Q("lg14","ledger",2,"lec3","At the end of the accounting year, which accounts are closed off by transfer to the statement of profit or loss, rather than having their balances carried forward?",
 ["Sales, purchases and rent","Bank, trade receivables and capital","Vehicles, inventory and trade payables","Bank loan, capital and accumulated depreciation"],0,
 "Счета доходов и расходов (**sales, purchases, rent**) закрываются в P&L. Счета активов, обязательств и капитала переносят сальдо (c/d → b/d).");
Q("lg15","ledger",2,"sem5","Which of the following balances from Mr Bobur's ledger belong on the CREDIT side of the trial balance?\n1 Allowance for receivables\n2 Drawings\n3 Accumulated depreciation\n4 Irrecoverable debts",
 ["1 and 3 only","2 and 4 only","1, 3 and 4 only","3 only"],0,
 "Allowance for receivables и accumulated depreciation — **кредитовые** (уменьшают активы). Drawings и irrecoverable debts (расход) — дебетовые.");
Q("lg16","ledger",3,"rev","The balances below were extracted from Mr Bobur's ledger at 31 May 2025 (he has no bank overdraft). What are the totals of the trial balance?",
 ["$231,290","$224,490","$238,090","$209,790"],0,
 "Credit: sales 146,500 + allowance 180 + payables 7,650 + accumulated depreciation 21,500 + capital 55,460 = **231,290**. Debit — все остальные строки, тоже 231,290.",
 {tbl:{h:["Account","$"],r:[["Sales","146,500"],["Purchases","88,200"],["Carriage","4,800"],["Drawings","6,800"],["Rent and insurance","7,950"],["Postage and stationery","2,750"],["Advertising","1,520"],["Salaries and wages","28,100"],["Irrecoverable debts","950"],["Allowance for receivables","180"],["Receivables","11,200"],["Payables","7,650"],["Cash on hand","220"],["Cash at bank","1,350"],["Inventory at 1 June 2024","12,450"],["Equipment at cost","65,000"],["Accumulated depreciation","21,500"],["Capital at 1 June 2024","55,460"]]}});
Q("lg17","ledger",2,"lec3","A business has a bank overdraft. On which side of the trial balance does the bank balance appear?",
 ["Credit, because an overdraft is a liability","Debit, because bank is always an asset","Either side; it does not matter","It is not included in the trial balance"],0,
 "Овердрафт — это **долг банку** (liability), поэтому сальдо кредитовое.");

/* ---------- 8. Errors & suspense accounts ---------- */
Q("er01","errors",1,"lec3","A cash sale of $100 was not recorded in the books at all. What type of error is this?",
 ["Error of omission","Error of commission","Error of principle","Error of original entry"],0,
 "Операция полностью пропущена: **error of omission**. TB при этом сходится.");
Q("er02","errors",1,"lec3","A credit sale of $10,000 to C Green was recorded in the account of K Green. What type of error is this?",
 ["Error of commission","Error of principle","Error of omission","Complete reversal of entries"],0,
 "Правильный тип счёта (receivable), но не тот клиент: **error of commission**.");
Q("er03","errors",1,"lec3","The purchase of a new delivery van for $15,000 was debited to the purchases account instead of the delivery vans account. What type of error is this?",
 ["Error of principle","Error of commission","Error of original entry","Compensating error"],0,
 "Внеоборотный актив записан как расход, то есть в счёт **другого типа**: **error of principle**.");
Q("er04","errors",1,"lec3","A cash sale of $76 was recorded as $67 in both the cash account and the sales account. What type of error is this?",
 ["Error of original entry","A transposition error that makes the trial balance disagree","Error of commission","Error of omission"],0,
 "Неправильная сумма записана **в обоих** счетах: **error of original entry**. TB сходится.");
Q("er05","errors",1,"lec3","Goods sold for cash for $200 were debited to sales and credited to cash. What type of error is this?",
 ["Complete reversal of entries","Error of principle","Error of commission","Single-sided entry"],0,
 "Правильные счета и сумма, но стороны перепутаны: **complete reversal of entries**.");
Q("er06","errors",1,"lec3","Which of the following errors WILL cause the trial balance not to balance?",
 ["A debit entry was made with no corresponding credit entry","A transaction was completely omitted from the books","A sale to A Khan was posted to B Khan's account","Repairs were debited to the machinery account"],0,
 "**Single-sided entry** нарушает равенство Dr и Cr. Остальные ошибки TB не показывает.");
Q("er07","errors",2,"lec3","Which of the following errors would NOT be revealed by extracting a trial balance?\n1 An error of omission\n2 A transposition error made in only one account\n3 An error of principle\n4 A casting (addition) error in the receivables account",
 ["1 and 3 only","2 and 4 only","1, 2 and 3 only","3 and 4 only"],0,
 "Omission и principle не нарушают равенство Dr и Cr. Ошибка суммы в одном счёте и ошибка сложения TB **нарушают**.");
Q("er08","errors",2,"lec3","The purchase of an asset costing $100 has been recorded by debiting $10 to the asset account and crediting $100 to cash. What journal entry corrects the error?",
 ["Dr Asset $90; Cr Suspense $90","Dr Suspense $90; Cr Asset $90","Dr Asset $100; Cr Cash $100","Dr Asset $90; Cr Cash $90"],0,
 "Should: Dr Asset 100 / Cr Cash 100. Did: Dr Asset 10 / Cr Cash 100, разница 90 ушла в suspense (Dr). Исправление: **Dr Asset 90 / Cr Suspense 90**. Cash уже верен.");
Q("er09","errors",2,"lec3","When a trial balance was extracted, the debit side totalled $125,300 and the credit side totalled $124,800. A suspense account was opened. What is the balance on the suspense account?",
 ["$500 Cr","$500 Dr","$250 Cr","$250 Dr"],0,
 "Кредитная сторона меньше на 500, поэтому suspense добавляется на кредит: **$500 Cr**, и TB сходится.");
Q("er10","errors",2,"sem3","A sale of goods on credit for $1,000 was correctly recorded in the customer's account but omitted from the sales account. What is the correcting journal?",
 ["Dr Suspense $1,000; Cr Sales $1,000","Dr Sales $1,000; Cr Suspense $1,000","Dr Receivables $1,000; Cr Sales $1,000","Dr Suspense $1,000; Cr Receivables $1,000"],0,
 "Дебет (receivables) записан, кредита нет, поэтому suspense принял 1,000 на кредит. Исправляем: **Dr Suspense / Cr Sales**.");
Q("er11","errors",3,"sem3","A purchase of raw materials for $350 was recorded in the purchases account as $850. The supplier's account was recorded correctly. What is the correcting journal?",
 ["Dr Suspense $500; Cr Purchases $500","Dr Purchases $500; Cr Suspense $500","Dr Payables $500; Cr Purchases $500","Dr Suspense $850; Cr Purchases $850"],0,
 "Purchases завышены на 500, причём только в одном счёте. Уменьшаем: Cr Purchases 500, вторая сторона — **Dr Suspense**.");
Q("er12","errors",2,"sem3","Commission received of $257 was entered in error in the sales account. What is the correcting journal?",
 ["Dr Sales $257; Cr Commission received $257","Dr Commission received $257; Cr Sales $257","Dr Suspense $257; Cr Commission received $257","Dr Sales $257; Cr Suspense $257"],0,
 "Кредит попал не в тот счёт дохода. Убираем из Sales (Dr) и ставим в Commission received (Cr). Suspense не нужен: TB сходился.");
Q("er13","errors",1,"sem3","A sale of goods for $678 to J Harris had been entered in J Hart's account. What is the correcting journal?",
 ["Dr J Harris $678; Cr J Hart $678","Dr J Hart $678; Cr J Harris $678","Dr Suspense $678; Cr J Hart $678","Dr J Harris $678; Cr Sales $678"],0,
 "Error of commission: переносим дебет с J Hart на J Harris: **Dr J Harris, Cr J Hart**.");
Q("er14","errors",1,"sem3","The purchase of a machine on credit from L Pyle for $4,390 had been completely omitted from the books. What is the correcting journal?",
 ["Dr Machine $4,390; Cr L Pyle $4,390","Dr L Pyle $4,390; Cr Machine $4,390","Dr Machine $4,390; Cr Suspense $4,390","Dr Purchases $4,390; Cr L Pyle $4,390"],0,
 "Omission: просто делаем пропущенную запись. **Dr Machine** (актив), **Cr L Pyle** (sundry payable).");
Q("er15","errors",1,"lec3","Which of the following statements about a suspense account is correct?",
 ["It is temporary and must be cleared before the financial statements are prepared","It is shown as an asset in the statement of financial position","It is used to record drawings","It is opened only when the trial balance agrees"],0,
 "Suspense — **временный** счёт; к составлению отчётности его сальдо должно стать нулевым.");
Q("er16","errors",2,"kap","A repair expense of $670 was recorded as $760, and an insurance expense of $1,100 was recorded as $1,010. Both errors were in the expense accounts only. What type of error is this?",
 ["Compensating error","Error of original entry","Error of principle","Complete reversal"],0,
 "Одна ошибка +90, другая −90, они гасят друг друга: **compensating error**. TB сходится.");
Q("er17","errors",3,"kap","A receipt of $530 from a credit customer was correctly credited to the receivables account, but the debit was posted to the payables account instead of cash at bank. What is the correcting journal?",
 ["Dr Cash at bank $530; Cr Payables $530","Dr Payables $530; Cr Cash at bank $530","Dr Suspense $530; Cr Payables $530","Dr Cash at bank $530; Cr Suspense $530"],0,
 "Should: Dr Cash / Cr Receivables. Did: Dr Payables / Cr Receivables. Убираем дебет из Payables (Cr) и ставим в Cash (Dr): **Dr Cash 530 / Cr Payables 530**. Suspense не нужен.");
Q("er18","errors",2,"kap","A bookkeeper recorded a receipt of $500 as Dr Bank, Cr Suspense because he did not know what it was. It is now found to be additional capital introduced by the owner. What is the correcting journal?",
 ["Dr Suspense $500; Cr Capital $500","Dr Capital $500; Cr Suspense $500","Dr Bank $500; Cr Capital $500","Dr Suspense $500; Cr Bank $500"],0,
 "Bank уже записан верно. Переносим кредит из suspense в capital: **Dr Suspense / Cr Capital**.");
Q("er19","errors",1,"lec3","Which statement about a trial balance that balances is correct?",
 ["A balanced trial balance does not guarantee that the accounting records are free from error","A balanced trial balance proves that all transactions have been recorded","A balanced trial balance proves the accounts are correct","If the trial balance balances, a suspense account can never be needed"],0,
 "Ошибки omission, commission, principle, original entry, reversal и compensating **не нарушают** баланс TB.");
Q("er20","errors",3,"kap","The purchase of a delivery van for $15,000 was debited to the purchases account. Ignoring depreciation, what is the effect of this error on the profit for the year?",
 ["Profit is understated by $15,000","Profit is overstated by $15,000","No effect on profit","Profit is understated by $30,000"],0,
 "Van (актив) записан как расход (purchases), расходы завышены на 15,000, поэтому прибыль **занижена** на 15,000.");

Q("iv01","inventory",1,"sem4","When valuing inventory, the following methods are available:\n1 FIFO\n2 AVCO\n3 LIFO\n4 Standard cost\nWhich methods are allowable under IAS 2 Inventories, as taught in this module?",
 ["1, 2 and 3","1, 2, 3 and 4","1 only","1 and 2"],3,
 "IAS 2 разрешает **FIFO и AVCO** (weighted average). **LIFO запрещён**.");
Q("iv02","inventory",1,"rev","What is included in the cost of purchase of inventories according to IAS 2?",
 ["Purchase price less trade discount","Purchase price plus transport costs less trade discount","Purchase price less import duties less trade discount","Purchase price plus import duties plus transport costs less trade discount"],3,
 "Cost of purchase = цена покупки **+ import duties + транспорт** (freight, carriage inwards) **− trade discount**.");

 ["$130,000","$108,000","$118,105","None of these figures"],0,

 {tbl:{h:["Date","Transaction","Units","$ each"],r:[["1 Jan","Opening inventory","800","180"],["1 Mar","Purchased","600","200"],["1 Jul","Sold for $75,000","300",""],["1 Sep","Purchased","500","220"],["15 Dec","Sold for $250,000","1,000",""]]}});
Q("iv04","inventory",3,"sem4","A company values inventory using the average cost method (AVCO) with a periodic inventory system. Its January transactions are shown below. What is the cost of goods sold for January?",
 ["$112,750","$112,980","$113,250","None of these figures"],1,
 "Средняя: (500×70 + 450×75 + 600×80) ÷ 1,550 = 116,750 ÷ 1,550 ≈ $75.32. Продано 1,500 ед. → COGS = 1,500 × 75.32 ≈ **$112,980**. Остаток 50 × 75.32 ≈ $3,766.",
