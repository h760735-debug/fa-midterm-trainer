Q("iv05","inventory",1,"lec4","Peter's opening inventory cost $9,500. During the year he purchased goods for $15,000 and paid $1,000 for carriage inwards (transport of the goods to his shop). Closing inventory cost $9,600. What is the cost of goods sold?",
 ["$15,900","$14,900","$16,100","$35,100"],0,
 "COGS = opening 9,500 + purchases 15,000 + carriage inwards 1,000 − closing 9,600 = **$15,900**. 14,900 — если забыть carriage inwards.");
Q("iv06","inventory",1,"lec4","Peter made sales of $20,000. His opening inventory was $9,500, purchases $15,000, carriage inwards $1,000 and closing inventory $9,600. What is the gross profit?",
 ["$4,100","$5,100","$3,900","$10,400"],0,
 "COGS = 9,500 + 15,000 + 1,000 − 9,600 = 15,900. Gross profit = 20,000 − 15,900 = **$4,100**.");
Q("iv07","inventory",1,"sem4","From the following information for April, calculate the cost of sales: purchases $45,000; opening inventory $3,000; closing inventory $4,000; purchases returns $5,000.",
 ["$39,000","$49,000","$41,000","$44,000"],0,
 "COGS = 3,000 + 45,000 − 5,000 − 4,000 = **$39,000**. Purchases returns **уменьшают** покупки.");
Q("iv08","inventory",2,"sem4","Clearwater Company had sales of $75,000, gross profit of $30,000 and net income of $10,800. What were its operating expenses?",
 ["$19,200","$45,000","$64,200","$40,800"],0,
 "COGS = 75,000 − 30,000 = 45,000. Operating expenses = gross profit − net income = 30,000 − 10,800 = **$19,200**.");
Q("iv09","inventory",3,"sem4","SS Ltd, a builders' merchant, had the sand transactions shown below in the first week of September. What is the cost of goods sold using FIFO?",
 ["$1,160","$1,245","$1,310","$770"],0,
 "FIFO: сначала продаём старое: 20 т × $18 + 40 т × $20 = **$1,160**. Остаток 33 т: 10 × 25 + 15 × 24 + 8 × 20 = $770.",
 {tbl:{h:["Date","Transaction","Tons","$ per ton"],r:[["1 Sep","Opening inventory","20","18"],["2 Sep","Purchased","48","20"],["4 Sep","Purchased","15","24"],["6 Sep","Purchased","10","25"],["7 Sep","Sold","60",""]]}});
Q("iv10","inventory",3,"sem4","Using the SS Ltd sand transactions below and the weighted average cost method (AVCO, periodic), what is the value of closing inventory (nearest $)?",
 ["$685","$770","$620","$1,245"],0,
 "Всего 93 т за $1,930, средняя ≈ $20.75. Остаток 33 т × 20.75 ≈ **$685**. (COGS = 60 × 20.75 ≈ $1,245.)",
 {tbl:{h:["Date","Transaction","Tons","$ per ton"],r:[["1 Sep","Opening inventory","20","18"],["2 Sep","Purchased","48","20"],["4 Sep","Purchased","15","24"],["6 Sep","Purchased","10","25"],["7 Sep","Sold","60",""]]}});
Q("iv11","inventory",2,"lec4","In a period of rising prices, which statement is correct?",
 ["FIFO gives a higher closing inventory and a higher profit than LIFO","FIFO gives a lower closing inventory and a lower profit than LIFO","LIFO gives a higher closing inventory than FIFO","FIFO and LIFO always give the same profit"],0,
 "При росте цен FIFO оставляет в запасах дорогие (новые) единицы: запасы выше, COGS ниже, **прибыль выше**.");
Q("iv12","inventory",1,"lec4","How is carriage outwards treated in the financial statements?",
 ["As a selling and distribution expense, not as part of cost of goods sold","As part of the cost of purchases","As a deduction from sales","As part of the value of closing inventory"],0,
 "Carriage **inwards** — в COGS (стоимость закупки). Carriage **outwards** — доставка покупателям, коммерческий расход.");
Q("iv13","inventory",1,"lec4","Net realisable value (NRV) is:",
 ["The estimated selling price less the costs to complete and sell","The original cost plus the costs of selling","The replacement cost of the item","The selling price plus a profit margin"],0,
 "**NRV = estimated selling price − costs to complete and sell.**");
Q("iv14","inventory",2,"lec4","An item of inventory cost $500. It is expected to sell for $520, but selling costs of $40 will be incurred. At what value should it be included in closing inventory?",
 ["$480","$500","$520","$460"],0,
 "NRV = 520 − 40 = 480. Lower of cost (500) and NRV (480) = **$480**.");
Q("iv15","inventory",2,"kap","Which of the following costs should NOT be included in the cost of inventory under IAS 2?",
 ["Selling costs","Import duties","Freight inwards","Direct labour used in production"],0,
 "IAS 2 исключает **selling costs**, хранение (обычно), abnormal wastage, administrative overheads. Пошлины, доставка до склада и прямой труд включаются.");
Q("iv16","inventory",2,"lec4","What is the journal entry to record closing inventory at the end of the year?",
 ["Dr Inventory (statement of financial position); Cr Cost of sales (statement of profit or loss)","Dr Cost of sales; Cr Inventory","Dr Purchases; Cr Inventory","Dr Inventory; Cr Sales"],0,
 "Closing inventory: **Dr Inventory** (актив), **Cr Cost of sales** (уменьшает COGS). Opening inventory — наоборот: Dr Cost of sales / Cr Inventory.");
Q("iv17","inventory",1,"lec4","Under a perpetual (continuous) inventory system:",
 ["Inventory and cost of goods sold are updated after every purchase and sale","Cost of goods sold is calculated only at the end of the period after a physical count","A physical count of inventory is never needed","Purchases are recorded in a separate account and inventory is updated once a year"],0,
 "**Perpetual** — постоянный учёт после каждой операции. Periodic — расчёт в конце периода по результатам инвентаризации.");
Q("iv18","inventory",3,"lec4","A company's TV set transactions for 2020 are shown below. Using FIFO, what is the cost of goods sold for the year?",
 ["$242,450","$267,850","$253,050","$255,204"],0,
 "Продано 570 + 115 = 685 шт. FIFO: 550 × 350 + 135 × 370 = 192,500 + 49,950 = **$242,450**. 253,050 — это FIFO closing inventory (480 × 400 + 165 × 370).",
 {tbl:{h:["Date","Transaction","Units","$ each"],r:[["1 Jan","Opening inventory","550","350"],["1 Mar","Purchased","300","370"],["1 Jun","Sold for $228,000","570",""],["1 Aug","Purchased","480","400"],["15 Dec","Sold for $48,300","115",""]]}});
Q("iv19","inventory",1,"lec4","Where is closing inventory shown in the statement of financial position?",
 ["Under current assets","Under non-current assets","Under current liabilities","It is not shown there, only in profit or loss"],0,
 "Closing inventory — **current asset**; в P&L он уменьшает COGS.");
Q("iv20","inventory",3,"ws4","G.D. Company's March inventory records are shown below; 500 units are on hand at 31 March. Using FIFO (periodic), what is the cost of closing inventory?",
 ["$2,450","$2,304","$2,424","$4,000"],0,
 "FIFO: остаются последние 500 ед.: 300 × 5.00 + 200 × 4.75 = **$2,450**. COGS = 6,450 − 2,450 = 4,000.",
 {tbl:{h:["Date","Transaction","Units","$ each"],r:[["1 Mar","Opening inventory","200","4.00"],["10 Mar","Purchased","500","4.50"],["15 Mar","Sold","500",""],["20 Mar","Purchased","400","4.75"],["25 Mar","Sold","400",""],["30 Mar","Purchased","300","5.00"]]}});
Q("iv21","inventory",3,"ws4","G.D. Company (records below) uses AVCO with a PERPETUAL inventory system, recalculating the average after each purchase. What is the cost of goods sold for March (nearest $)?",
 ["$4,026","$4,146","$4,000","$2,424"],0,
 "После 10 March: 700 ед. за 3,050 → $4.357; продажа 500 → 2,178.57. Остаток 871.43 + 1,900 = 2,771.43 за 600 ед. → $4.619; продажа 400 → 1,847.62. COGS ≈ 2,178.57 + 1,847.62 = **$4,026**. (4,146 — periodic AVCO.)",
 {tbl:{h:["Date","Transaction","Units","$ each"],r:[["1 Mar","Opening inventory","200","4.00"],["10 Mar","Purchased","500","4.50"],["15 Mar","Sold","500",""],["20 Mar","Purchased","400","4.75"],["25 Mar","Sold","400",""],["30 Mar","Purchased","300","5.00"]]}});
Q("iv22","inventory",1,"lec4","Gross profit is calculated as:",
 ["Sales minus cost of goods sold","Sales minus all expenses","Cost of goods sold minus purchases","Net profit plus cost of goods sold"],0,
 "**Gross profit = Sales − COGS.** Net profit = gross profit + other income − expenses.");
Q("iv23","inventory",2,"lec4","Which of the following is the correct formula for cost of goods sold?",
 ["Opening inventory + purchases − purchase returns + carriage inwards − closing inventory","Opening inventory + purchases + carriage outwards − closing inventory","Closing inventory + purchases − opening inventory","Opening inventory − purchases + closing inventory"],0,
 "COGS = opening inventory + purchases − returns outwards + **carriage inwards** − closing inventory.");

/* ---------- 10. Non-current assets & depreciation ---------- */
Q("dp01","depr",1,"sem5","What is the main purpose of charging depreciation?",
 ["To provide funds for asset replacement","To reduce the cost of repairing assets","To show assets at their realisable values in the statement of financial position","To spread the cost of an asset over its useful life"],3,
 "Амортизация **распределяет стоимость** актива на срок полезного использования (matching). Она не создаёт денег на замену и не показывает рыночную стоимость.");
Q("dp02","depr",3,"rev","Laura purchased machinery on 1 March 2021 at a total invoice cost of $525,000. The machinery has an estimated residual value of $5,000 and an estimated useful life of 5 years. Straight-line depreciation is charged for each month of ownership. What is the accumulated depreciation at 31 December 2022?",
 ["$104,000","$190,667","$208,000","$8,667"],1,
 "В год: (525,000 − 5,000) ÷ 5 = 104,000; в месяц 8,667. 2021: март–декабрь = 10 мес. = 86,667; 2022: 104,000. Итого **$190,667**.");
Q("dp03","depr",1,"rev","What is the journal entry to record depreciation of an asset for the year?",
 ["Dr Depreciation expense (P&L); Cr Accumulated depreciation (statement of financial position)","Dr Asset account (P&L); Cr Accumulated depreciation (statement of financial position)","Dr Accumulated depreciation (statement of financial position); Cr Depreciation expense (P&L)","Dr Depreciation expense (statement of financial position); Cr Accumulated depreciation (P&L)"],0,
 "Расход в P&L по **дебету**, накопленная амортизация (контр-актив в балансе) по **кредиту**.");
Q("dp04","depr",1,"lec5","Mead buys a car on 1 January for $12,000. He estimates its useful life is four years, after which he will trade it in for $2,400. Using the straight-line method, what is the annual depreciation charge?",
 ["$2,400","$3,000","$3,600","$9,600"],0,
 "(Cost − residual) ÷ life = (12,000 − 2,400) ÷ 4 = **$2,400**. 3,000 — если забыть вычесть residual value.");
Q("dp05","depr",2,"lec5","A van costs $5,000 and is depreciated at 40% per year using the reducing balance method. What is the depreciation charge for year 3?",
 ["$720","$2,000","$1,200","$1,080"],0,
 "Год 1: 5,000 × 40% = 2,000 (NBV 3,000). Год 2: 3,000 × 40% = 1,200 (NBV 1,800). Год 3: 1,800 × 40% = **$720**. 1,080 — это NBV после 3-го года.");
Q("dp06","depr",2,"sem5","A delivery vehicle costs $25,000, has a useful life of 5 years and a scrap value of $2,000. What is the depreciation charge in year 5 using the straight-line method?",
 ["$4,600","$5,000","$1,296","$9,200"],0,
 "(25,000 − 2,000) ÷ 5 = **$4,600** каждый год, включая 5-й. 1,296 — это reducing balance 40% в 5-м году.");
Q("dp07","depr",3,"sem5","A delivery vehicle costs $25,000 and is depreciated using the reducing balance method at 40% per year. What is the depreciation charge in year 5?",
 ["$1,296","$4,600","$1,944","$2,160"],0,
 "NBV: 25,000 → 15,000 → 9,000 → 5,400 → 3,240. Год 5: 3,240 × 40% = **$1,296** (NBV на конец 1,944). 2,160 — это 4-й год.");
Q("dp08","depr",2,"lec5","ABC acquired equipment for $20,000 (residual value $2,000, useful life 4 years, straight-line). What is the carrying amount of the equipment at the end of the first year?",
 ["$15,500","$15,000","$18,000","$4,500"],0,
 "Depreciation = (20,000 − 2,000) ÷ 4 = 4,500. Carrying amount (NBV) = 20,000 − 4,500 = **$15,500**.");
Q("dp09","depr",2,"sem5","In which circumstances is the reducing balance method more appropriate than the straight-line method?",
 ["When the asset gives greater benefits in its early years of use","When the asset is used evenly over its life","When the asset is land","When the business wants the same charge every year"],0,
 "Reducing balance даёт **больший расход в первые годы**: подходит, если актив приносит больше пользы в начале (транспорт, компьютеры).");
Q("dp10","depr",1,"lec5","Which of the following assets is normally NOT depreciated?",
 ["Freehold land","Buildings","Delivery vans","Computer equipment"],0,
 "Земля (**freehold land**) обычно имеет неограниченный срок службы, поэтому не амортизируется (IAS 16). Здания амортизируются.");
Q("dp11","depr",2,"kap","Which of the following costs can be capitalised as part of the cost of a new machine?\n1 Purchase price\n2 Delivery costs\n3 Installation and testing costs\n4 Cost of training staff to use the machine",
 ["1, 2 and 3 only","1 and 2 only","1, 2, 3 and 4","2, 3 and 4 only"],0,
 "IAS 16: цена + доставка + установка и тестирование (затраты на приведение актива в рабочее состояние). **Обучение персонала — расход.**");
Q("dp12","depr",3,"kap","Billie started a taxi business. Costs in the year: office premises $250,000; legal fees for the purchase of the office $10,000; painting the office in Billie's favourite colour $300; cars $116,000; number plates for the cars $210; delivery charge for the cars $180; road licence fee for the cars $480; drivers' wages $60,000. What amounts should be capitalised as 'Land and buildings' and 'Motor vehicles'?",
 ["Land and buildings $260,000; Motor vehicles $116,390","Land and buildings $250,000; Motor vehicles $116,870","Land and buildings $250,300; Motor vehicles $116,390","Land and buildings $260,300; Motor vehicles $116,870"],0,
 "Здание: 250,000 + legal fees 10,000 = **260,000** (покраска — расход). Машины: 116,000 + номера 210 + доставка 180 = **116,390** (road licence — ежегодный расход).");
Q("dp13","depr",3,"sem5","Contractors Ltd bought Machines 1 and 2 on 1 January 2018 for $40,000 each, and Machines 3 and 4 on 1 October 2018 for $15,200 each. Each machine has a 10-year life and a residual value of 5% of cost. Depreciation is straight-line and charged for every month an asset is owned. What is the total depreciation on machinery for 2018?",
 ["$8,322","$10,488","$7,600","$8,760"],0,
 "M1, M2: (40,000 − 2,000) ÷ 10 = 3,800 × 2 = 7,600. M3, M4: (15,200 − 760) ÷ 10 = 1,444 в год × 3/12 = 361 × 2 = 722. Итого **$8,322**.");
Q("dp14","depr",3,"sem5","Contractors Ltd bought Machine 3 on 1 October 2018 for $15,200 (10-year life, residual value 5% of cost, straight-line, charged for each month owned). It was sold on 30 June 2020 for $12,640. What is the profit or loss on disposal?",
 ["$33 loss","$33 profit","$2,560 loss","$1,772 profit"],0,
 "В год: (15,200 − 760) ÷ 10 = 1,444. Владели 3 мес. (2018) + 12 (2019) + 6 (2020) = 21 мес. → 1,444 × 21/12 = 2,527. NBV = 15,200 − 2,527 = 12,673. 12,640 − 12,673 = **$33 loss**.");
Q("dp15","depr",1,"lec5","How is accumulated depreciation shown in the statement of financial position?",
 ["Deducted from the cost of the asset to give the carrying amount","As a current liability","As an expense","Added to the cost of the asset"],0,
 "Accumulated depreciation — контр-актив: **Cost − Accumulated depreciation = Carrying amount** (NBV).");
Q("dp16","depr",3,"kap","A machine costing $60,000 was being depreciated straight-line over 10 years with no residual value. After 4 years, the remaining useful life is revised to 4 years. What is the depreciation charge for year 5?",
 ["$9,000","$6,000","$7,500","$15,000"],0,
 "NBV после 4 лет = 60,000 − 24,000 = 36,000. Новая оценка: остаток делим на оставшийся срок: 36,000 ÷ 4 = **$9,000** (change in accounting estimate, IAS 8).");
Q("dp17","depr",1,"lec5","Obsolescence, where an asset becomes outdated because of new technology, is an example of which cause of depreciation?",
 ["Economic factors","Physical deterioration","Depletion","Passage of time"],0,
 "**Economic factors**: obsolescence (устаревание) и inadequacy (недостаточность). Physical — износ; depletion — истощение природных ресурсов.");
Q("dp18","depr",3,"rev","Mr Bobur's equipment cost $65,000 and had accumulated depreciation of $21,500 at 1 June 2024. Equipment is depreciated at 15% per annum using the straight-line method. What is the carrying amount of the equipment at 31 May 2025?",
 ["$33,750","$43,500","$55,250","$36,975"],0,
 "Depreciation = 15% × 65,000 = 9,750. Accumulated = 21,500 + 9,750 = 31,250. Carrying amount = 65,000 − 31,250 = **$33,750**. (36,975 — ошибка: 15% от NBV, как в reducing balance.)");
Q("dp19","depr",2,"lec5","What is the effect of charging depreciation on profit and on cash?",
 ["Profit decreases; cash is not affected","Profit decreases; cash decreases","Profit is not affected; cash decreases","Both profit and cash increase"],0,
 "Depreciation — **неденежный** расход: уменьшает прибыль, но деньги не уходят (они ушли при покупке актива).");
Q("dp20","depr",2,"kap","Which of the following is capital expenditure?",
 ["Building an extension to a shop to provide extra selling space","Repainting the office","Repairing a broken machine","Training staff to use new software"],0,
 "Capital expenditure **увеличивает выгоды** от актива (расширение магазина). Ремонт, покраска и обучение — revenue expenditure (расходы).");
Q("dp21","depr",1,"lec5","Equipment costs $20,000, residual value $2,000, useful life 4 years, straight-line. What is the depreciation charge for one month?",
 ["$375","$417","$4,500","$1,500"],0,
 "В год (20,000 − 2,000) ÷ 4 = 4,500; в месяц 4,500 ÷ 12 = **$375**. 417 = 5,000 ÷ 12 (без вычета residual).");

/* ---------- 11. Irrecoverable debts & allowance ---------- */
Q("bd01","debts",2,"sem5","At the start of the year, a business's allowance for receivables was $20,000. The business wrote off irrecoverable debts of $90,000 during the year. At the end of the year the business requires an allowance of $24,000. What is the total charge in the statement of profit or loss for irrecoverable and doubtful debts?",
 ["$94,000","$88,000","$115,000","$90,000"],0,
 "Charge = списания 90,000 + **увеличение** резерва (24,000 − 20,000) 4,000 = **$94,000**.");
Q("bd02","debts",2,"rev","Trade receivables were $77,000 at the end of 2021 and $92,000 at the end of 2022. The allowance for receivables is 2% of trade receivables. What is the effect of the allowance on profit for 2022?",
 ["Profit decreases by $300","Profit decreases by $1,840","Profit increases by $300","Profit decreases by $1,540"],0,
 "Резерв 2021: 1,540; 2022: 1,840. Изменение +300 — это расход: прибыль **уменьшается на $300**.");
Q("bd03","debts",2,"rev","Trade receivables were $92,000 at the end of 2022 and $86,000 at the end of 2023. The allowance for receivables is 2% of trade receivables. What is the effect of the allowance on profit for 2023?",
 ["Profit increases by $120","Profit decreases by $120","Profit decreases by $1,720","Profit increases by $1,720"],0,
 "Резерв: 1,840 → 1,720. Уменьшение на 120: Dr Allowance / Cr Irrecoverable debts expense, поэтому прибыль **увеличивается на $120**.");
Q("bd04","debts",1,"lec5","What is the journal entry to write off an irrecoverable debt?",
 ["Dr Irrecoverable debts expense; Cr Trade receivables","Dr Trade receivables; Cr Irrecoverable debts expense","Dr Irrecoverable debts expense; Cr Allowance for receivables","Dr Sales; Cr Trade receivables"],0,
 "Списание: расход по дебету, дебиторка уменьшается по кредиту: **Dr Irrecoverable debts expense / Cr Trade receivables**. Sales при этом не меняются.");
Q("bd05","debts",2,"lec5","The allowance for receivables is to be DECREASED from $214 to $180. What is the journal entry?",
 ["Dr Allowance for receivables $34; Cr Irrecoverable debts expense $34","Dr Irrecoverable debts expense $34; Cr Allowance for receivables $34","Dr Allowance for receivables $180; Cr Irrecoverable debts expense $180","Dr Trade receivables $34; Cr Allowance for receivables $34"],0,
 "Уменьшение резерва: **Dr Allowance 34 / Cr Irrecoverable debts expense 34**. Расход уменьшается, прибыль растёт.");
Q("bd06","debts",3,"lec5","A business estimates its allowance for receivables using the ageing schedule below. What is the allowance for receivables?",
 ["$214","$182","$458","$9,160"],0,
 "50 + 90 + 32 + 10 + 32 = **$214**. (458 — если взять 5% от всей суммы.)",
 {tbl:{h:["Period owing","Amount $","% doubtful"],r:[["Less than 1 month","5,000","1%"],["1–2 months","3,000","3%"],["2–3 months","800","4%"],["3 months – 1 year","200","5%"],["Over 1 year","160","20%"]]}});
Q("bd07","debts",1,"lec5","Trade receivables are $9,160 and the allowance for receivables is $214. What figure is shown for net receivables under current assets?",
 ["$8,946","$9,160","$9,374","$214"],0,
 "Net receivables = 9,160 − 214 = **$8,946**. Allowance вычитается из дебиторки.");
Q("bd08","debts",3,"kap","Asher had receivables of $3,655 at 31 December 20X7. At that date a debt of $699 from Lex was written off. During 20X8 Asher made credit sales of $17,832 and received cash from customers of $16,936. Asher also received $699 from Lex, which had previously been written off. What is the balance on the receivables account at 31 December 20X7 and at 31 December 20X8?",
 ["20X7 $2,956; 20X8 $3,852","20X7 $2,956; 20X8 $3,153","20X7 $3,655; 20X8 $4,551","20X7 $3,655; 20X8 $3,852"],0,
 "20X7: 3,655 − 699 = **2,956**. 20X8: 2,956 + 17,832 − 16,936 = **3,852**. Возврат списанного долга не проходит через receivables: Dr Cash / Cr Irrecoverable debts expense.");
Q("bd09","debts",2,"kap","A debt of $400 that was written off as irrecoverable last year is unexpectedly received in cash this year. What is the double entry?",
 ["Dr Cash $400; Cr Irrecoverable debts expense $400","Dr Cash $400; Cr Trade receivables $400","Dr Trade receivables $400; Cr Cash $400","Dr Cash $400; Cr Sales $400"],0,
 "Долг уже убран из receivables, поэтому кредит идёт в **irrecoverable debts expense** (или отдельный счёт «debts recovered»).");
Q("bd10","debts",3,"sem5","In 2023 a business wrote off irrecoverable debts of $680, $290 and $470. The allowance for receivables was $3,230 at 31 December 2022 and is to be $4,010 at 31 December 2023. What is the total charge to profit or loss for 2023 for irrecoverable debts and the allowance?",
 ["$2,220","$1,440","$5,450","$780"],0,
 "Списано 680 + 290 + 470 = 1,440; рост резерва 4,010 − 3,230 = 780. Итого **$2,220**.");
Q("bd11","debts",2,"sem5","At 31 December 2022 trade receivables (after write-offs) were $97,100 and the allowance for receivables was $3,230. What is shown for net trade receivables in the statement of financial position?",
 ["$93,870","$97,100","$96,190","$100,330"],0,
 "97,100 − 3,230 = **$93,870**.");
Q("bd12","debts",3,"sem5","Adela keeps an allowance for receivables. At 31 March 2011 it was 3% of receivables of $22,000. At 31 March 2012 she decides the allowance should be 2% of receivables of $24,000. What is the effect on profit for the year ended 31 March 2012?",
 ["Profit increases by $180","Profit decreases by $480","Profit decreases by $180","Profit increases by $480"],0,
 "Было 3% × 22,000 = 660, нужно 2% × 24,000 = 480. Уменьшение на 180, поэтому прибыль **увеличивается на $180**.");
Q("bd13","debts",1,"lec5","How is the allowance for receivables shown in the statement of financial position?",
 ["Deducted from trade receivables under current assets","As a current liability","As an expense","Added to trade receivables"],0,
 "Allowance — контр-актив: **Trade receivables − Allowance = net receivables** (current assets).");
Q("bd14","debts",2,"kap","Araf & Co has trade receivables of $45,000. A customer owing $790 has been declared bankrupt and another owing $1,240 has disappeared. Both debts are written off. What are the trade receivables after the write-off, and the irrecoverable debts expense?",
 ["Receivables $42,970; expense $2,030","Receivables $45,000; expense $2,030","Receivables $42,970; expense $0","Receivables $47,030; expense $2,030"],0,
 "Списываем 790 + 1,240 = 2,030: Dr Irrecoverable debts expense / Cr Receivables. Остаток 45,000 − 2,030 = **$42,970**.");
Q("bd15","debts",1,"lec5","What type of balance does the allowance for receivables account normally have?",
 ["A credit balance","A debit balance","No balance, because it is cleared each year","Either, depending on profit"],0,
 "Allowance — **кредитовое** сальдо (уменьшает актив receivables).");
Q("bd16","debts",3,"kap","Before any adjustments, trade receivables are $50,000. A debt of $2,000 is to be written off. An allowance of 5% of the remaining receivables is required. The opening allowance is $1,800. What is the total charge to profit or loss for irrecoverable debts and the allowance?",
 ["$2,600","$2,700","$4,400","$600"],0,
 "Сначала списание: 50,000 − 2,000 = 48,000. Резерв 5% × 48,000 = 2,400; рост 2,400 − 1,800 = 600. Итого 2,000 + 600 = **$2,600**. (2,700 — если взять 5% от 50,000.)");
Q("bd17","debts",1,"lec5","A doubtful debt is best described as:",
 ["A debt that may not be paid, but has not yet been proven to be irrecoverable","A debt that has definitely become uncollectable","A debt owed by the business to a supplier","A debt that has been paid late but in full"],0,
 "**Doubtful** — есть сомнения, но долг ещё не признан безнадёжным, поэтому создаём allowance. Irrecoverable (bad) — точно не получим, поэтому списываем.");
Q("bd18","debts",2,"rev","Trade receivables are $77,000 at 31 December 2021, the first year of trading. An allowance of 2% is required. What is the journal entry?",
 ["Dr Irrecoverable debts expense $1,540; Cr Allowance for receivables $1,540","Dr Allowance for receivables $1,540; Cr Irrecoverable debts expense $1,540","Dr Irrecoverable debts expense $1,540; Cr Trade receivables $1,540","Dr Trade receivables $1,540; Cr Allowance for receivables $1,540"],0,
 "Создание резерва: 2% × 77,000 = 1,540. **Dr expense / Cr Allowance**; сами receivables напрямую не уменьшаются.");

/* ---------- 12. Accruals & prepayments (bonus) ---------- */
Q("ac01","accruals",2,"new","During the year a business paid electricity bills of $5,000. At the start of the year $400 was owing for electricity, and at the end of the year $600 was owing. What is the electricity expense for the year?",
 ["$5,200","$5,000","$5,600","$4,800"],0,
 "Expense = paid 5,000 − opening accrual 400 + closing accrual 600 = **$5,200**.");
Q("ac02","accruals",2,"new","A business with a 31 December year end paid annual rent of $12,000 on 1 October for the 12 months to 30 September of the next year. What is the rent expense for the year and the prepayment at 31 December?",
 ["Expense $3,000; prepayment $9,000","Expense $12,000; prepayment $0","Expense $9,000; prepayment $3,000","Expense $3,000; accrual $9,000"],0,
 "Октябрь–декабрь = 3 месяца → expense 12,000 × 3/12 = **3,000**. Оплачено вперёд 9 месяцев = **prepayment 9,000** (current asset).");
Q("ac03","accruals",1,"new","An accrued expense (accrual) at the year end is shown in the statement of financial position as:",
 ["A current liability","A current asset","A non-current asset","Part of capital"],0,
 "Accrual — расход уже был, но не оплачен, то есть долг: **current liability**.");
Q("ac04","accruals",1,"new","A prepayment at the year end is shown in the statement of financial position as:",
 ["A current asset","A current liability","An expense","Part of revenue"],0,
 "Prepayment — заплатили за будущий период: **актив** (current asset).");
Q("ac05","accruals",1,"new","At the year end, wages of $300 are owing to staff. What is the journal entry?",
 ["Dr Wages expense $300; Cr Accruals $300","Dr Accruals $300; Cr Wages expense $300","Dr Prepayments $300; Cr Wages expense $300","Dr Wages expense $300; Cr Bank $300"],0,
 "Accrual: увеличиваем расход (**Dr Wages**), признаём обязательство (**Cr Accruals**).");
Q("ac06","accruals",2,"new","A landlord receives $2,000 of rent in advance for next year. How is this shown in the landlord's statement of financial position at the year end?",
 ["As a liability (deferred income)","As an asset (accrued income)","As income for this year","It is not shown"],0,
 "Деньги получены за будущий период: **обязательство** (deferred income). Доход признают, когда он заработан.");
Q("ac07","accruals",2,"new","A business had prepaid insurance of $400 at the start of the year. It paid $2,400 during the year, and at the end of the year $600 is prepaid. What is the insurance expense for the year?",
 ["$2,200","$2,600","$2,400","$3,400"],0,
 "Expense = 400 + 2,400 − 600 = **$2,200** (начальная предоплата относится к этому году, конечная — к следующему).");
Q("ac08","accruals",1,"new","Which accounting concept requires expenses to be recognised in the period in which they are incurred, rather than when they are paid?",
 ["Accruals (matching)","Going concern","Money measurement","Business entity"],0,
 "**Accruals / matching**: доходы и расходы признают в периоде, к которому они относятся, а не когда движутся деньги.");
Q("ac09","accruals",2,"new","A business forgets to record an accrual of $500 for electricity at the year end. What is the effect on the financial statements?",
 ["Profit is overstated by $500 and liabilities are understated by $500","Profit is understated by $500 and assets are overstated by $500","Profit is overstated by $500 and assets are understated by $500","There is no effect on profit"],0,
 "Не учтён расход: прибыль **завышена** на 500; не учтено обязательство: liabilities **занижены** на 500.");

</script>
<script>/* Seeded question generators: the same seed always rebuilds the same question,
   so a generated question can be stored as "g:<generator>:<seed>" and shown again later. */

function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function mkR(seed){
  var r = mulberry32(seed);
  return {
    r: r,
    int: function(a, b){ return a + Math.floor(r() * (b - a + 1)); },
    pick: function(arr){ return arr[Math.floor(r() * arr.length)]; },
    chance: function(p){ return r() < p; }
  };
}

var G_NAMES = ['Aziz','Dilnoza','Rustam','Malika','Timur','Nodira','Sardor','Kamola','Jasur','Laylo','Bekzod','Shahnoza'];
var G_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function num(n){ return Math.round(n).toLocaleString('en-US'); }
function usd(n){ return '$' + num(Math.abs(n)); }
function pl(n){ return n >= 0 ? usd(n) + ' profit' : usd(-n) + ' loss'; }
function drcr(n){ return usd(n) + (n >= 0 ? ' Dr' : ' Cr'); }

/* Build 4 options: the correct value plus 3 distinct distractors (typical mistakes first). */
function opts(R, correct, cands, show, allowNeg){
  var key = function(v){ return Math.round(v); };
  var seen = {}; seen[key(correct)] = 1;
  var out = [];
  for (var i = 0; i < cands.length && out.length < 3; i++){
    var c = cands[i];
    if (!isFinite(c)) continue;
    if (!allowNeg && c <= 0) continue;
    var k = key(c);
    if (seen[k]) continue;
    seen[k] = 1; out.push(c);
  }
  var step = Math.max(100, Math.round(Math.abs(correct) * 0.08 / 100) * 100), n = 1;
  while (out.length < 3){
    var v = correct + (n % 2 ? 1 : -1) * step * Math.ceil(n / 2); n++;
    if (!allowNeg && v <= 0) continue;
    var kv = key(v);
    if (seen[kv]) continue;
    seen[kv] = 1; out.push(v);
  }
  var vals = [correct].concat(out), idx = [0, 1, 2, 3];
  for (var j = 3; j > 0; j--){ var m = Math.floor(R.r() * (j + 1)); var t = idx[j]; idx[j] = idx[m]; idx[m] = t; }
  return { o: idx.map(function(i){ return show(vals[i]); }), a: idx.indexOf(0) };
}
function withOpts(q, o){ q.o = o.o; q.a = o.a; return q; }

var GENS = {};

/* Accounting equation: closing net assets or opening capital */
GENS.eqclose = { t:'equation', f:function(R){
  var nm = R.pick(G_NAMES);
  var O = R.int(40,180)*1000 + R.int(0,9)*100, I = R.int(2,30)*1000, P = R.int(10,60)*1000 + R.int(0,9)*100, D = R.int(5,35)*1000 + R.int(0,9)*100;
  var C = O + I + P - D;
  if (R.int(0,1) === 0){
    return withOpts({
      s: 'At 1 January 20X5 the net assets of ' + nm + "'s business were " + usd(O) + '. During the year ' + nm + ' introduced additional capital of ' + usd(I) + ' and took drawings of ' + usd(D) + '. The business made a profit of ' + usd(P) + '. What were the net assets at 31 December 20X5?',
      e: 'Closing net assets = opening + capital introduced + profit − drawings = ' + num(O) + ' + ' + num(I) + ' + ' + num(P) + ' − ' + num(D) + ' = **' + usd(C) + '**.'
    }, opts(R, C, [O + P - D - I, O + I + P + D, O + P - D, O + I - P - D], usd));
  }
  return withOpts({
    s: 'At 31 December 20X5 the net assets of ' + nm + "'s business were " + usd(C) + '. During 20X5 the business made a profit of ' + usd(P) + ', ' + nm + ' introduced new capital of ' + usd(I) + ' and took drawings of ' + usd(D) + '. What was the capital at 1 January 20X5?',
    e: 'Opening capital = closing − profit − capital introduced + drawings = ' + num(C) + ' − ' + num(P) + ' − ' + num(I) + ' + ' + num(D) + ' = **' + usd(O) + '**.'
  }, opts(R, O, [C - P - I - D, C - P + D, C + I + P - D, C - P - I], usd));
}};

/* Accounting equation: profit or loss from the change in net assets */
GENS.eqprofit = { t:'equation', f:function(R){
  var nm = R.pick(G_NAMES);
  var O = R.int(60,200)*1000, I = R.int(5,40)*1000, D = R.int(5,30)*1000;
  var P = R.chance(0.8) ? R.int(5,60)*1000 : -R.int(3,20)*1000;
  var C = O + I + P - D;
  return withOpts({
    s: 'The net assets of ' + nm + "'s business were " + usd(O) + ' at the start of the year and ' + usd(C) + ' at the end of the year. During the year ' + nm + ' introduced capital of ' + usd(I) + ' and took drawings of ' + usd(D) + '. What was the profit or loss for the year?',
    e: 'Profit = closing NA − opening NA − capital introduced + drawings = ' + num(C) + ' − ' + num(O) + ' − ' + num(I) + ' + ' + num(D) + ' = **' + pl(P) + '**.'
  }, opts(R, P, [C - O, C - O - I - D, C - O + I + D, -P], pl, true));
}};

/* Inventory: cost of goods sold or gross profit */
GENS.cogs = { t:'inventory', f:function(R){
  var nm = R.pick(G_NAMES);
  var OI = R.int(5,30)*1000 + R.int(0,9)*100, PU = R.int(40,150)*1000, CI = R.int(5,30)*100, CO = R.int(5,30)*100, RO = R.int(10,50)*100, CL = R.int(5,30)*1000 + R.int(0,9)*100;
  var C = OI + PU - RO + CI - CL;
  var S = Math.round(C * (1.25 + R.r() * 0.35) / 100) * 100;
  var tbl = {h:['Item','$'], r:[['Sales',num(S)],['Opening inventory',num(OI)],['Purchases',num(PU)],['Returns outwards (purchase returns)',num(RO)],['Carriage inwards',num(CI)],['Carriage outwards',num(CO)],['Closing inventory',num(CL)]]};
  var work = num(OI) + ' + ' + num(PU) + ' − ' + num(RO) + ' + ' + num(CI) + ' − ' + num(CL);
  if (R.int(0,1) === 0){
    return withOpts({
      s: 'The figures below relate to ' + nm + "'s trading business for the year. What is the cost of goods sold?", x:{tbl:tbl},
      e: 'COGS = opening inventory + purchases − returns outwards + carriage inwards − closing inventory = ' + work + ' = **' + usd(C) + '**. Carriage outwards — коммерческий расход, в COGS не входит.'
    }, opts(R, C, [C + CO, C + 2*RO, C - CI, PU - RO + CI + CL - OI], usd));
  }
  var G = S - C;
  return withOpts({
    s: 'The figures below relate to ' + nm + "'s trading business for the year. What is the gross profit?", x:{tbl:tbl},
    e: 'COGS = ' + work + ' = ' + usd(C) + '. Gross profit = sales − COGS = ' + num(S) + ' − ' + num(C) + ' = **' + usd(G) + '**. Carriage outwards вычитают позже, при расчёте net profit.'
  }, opts(R, G, [G - CO, G - 2*RO, G + CI, S - PU], usd));
}};

/* Shared inventory data: opening + 2 purchases + 2 sales, rising prices */
function takeLayers(layers, q){
  var left = q, val = 0, parts = [];
  for (var i = 0; i < layers.length && left > 0; i++){
    var k = Math.min(layers[i][0], left);
    val += k * layers[i][1]; parts.push(k + ' × ' + layers[i][1]); left -= k;
  }
  return { val: val, parts: parts };
}
function invData(R){
  var u0 = R.int(2,8)*50, u1 = R.int(3,10)*50, u2 = R.int(3,10)*50;
  var c0 = R.int(20,60)*5, c1 = c0 + R.int(1,6)*5, c2 = c1 + R.int(1,6)*5;
  var tot = u0 + u1 + u2;
  var s1 = R.int(1, (u0 + u1)/50 - 1) * 50;
  var rem = tot - s1;
  var Q = R.int(1, rem/50 - 1) * 50;
  var s2 = rem - Q;
  var p1 = c2 + R.int(4,20)*5, p2 = c2 + R.int(4,20)*5;
  var d = { u0:u0, u1:u1, u2:u2, c0:c0, c1:c1, c2:c2, tot:tot, s1:s1, s2:s2, Q:Q, TC: u0*c0 + u1*c1 + u2*c2 };
  d.newQ = takeLayers([[u2,c2],[u1,c1],[u0,c0]], Q);
  d.oldQ = takeLayers([[u0,c0],[u1,c1],[u2,c2]], Q);
  d.tbl = {h:['Date','Transaction','Units','$ each'], r:[
    ['1 Jan','Opening inventory',num(u0),String(c0)],
    ['1 Mar','Purchased',num(u1),String(c1)],
    ['1 Jun','Sold for ' + usd(s1*p1),num(s1),''],
    ['1 Sep','Purchased',num(u2),String(c2)],
    ['15 Dec','Sold for ' + usd(s2*p2),num(s2),'']
  ]};
  d.unitsLine = 'Остаток: ' + u0 + ' + ' + u1 + ' − ' + s1 + ' + ' + u2 + ' − ' + s2 + ' = ' + Q + ' ед. ';
  return d;
}

GENS.fifo = { t:'inventory', f:function(R){
  var d = invData(R);
  var fifoCl = d.newQ.val, lifoCl = d.oldQ.val, avcoCl = Math.round(d.Q * d.TC / d.tot);
  var head = 'A company values its inventory using FIFO. Its transactions for the year are shown below.';
  if (R.int(0,1) === 0){
    return withOpts({
      s: head + ' What is the value of closing inventory at 31 December?', x:{tbl:d.tbl},
      e: d.unitsLine + 'По FIFO в остатке самые новые единицы: ' + d.newQ.parts.join(' + ') + ' = **' + usd(fifoCl) + '**.'
    }, opts(R, fifoCl, [lifoCl, avcoCl, d.TC - fifoCl, d.Q * d.c0, d.Q * d.c1], usd));
  }
  var cogs = d.TC - fifoCl;
  return withOpts({
    s: head + ' What is the cost of goods sold for the year?', x:{tbl:d.tbl},
    e: d.unitsLine + 'Closing по FIFO (самые новые): ' + d.newQ.parts.join(' + ') + ' = ' + usd(fifoCl) + '. Все товары стоили ' + usd(d.TC) + '. COGS = ' + num(d.TC) + ' − ' + num(fifoCl) + ' = **' + usd(cogs) + '**.'
  }, opts(R, cogs, [d.TC - lifoCl, d.TC - avcoCl, fifoCl, d.TC], usd));
}};

GENS.avco = { t:'inventory', f:function(R){
  var d = invData(R);
  var avg = d.TC / d.tot, sold = d.s1 + d.s2;
  var cogs = Math.round(sold * avg), cl = Math.round(d.Q * avg);
  var simple = (d.c0 + d.c1 + d.c2) / 3;
  var head = 'A company uses the weighted average cost method (AVCO) with a periodic system, so one average cost is used for the whole year. Its transactions are shown below.';
  var w = 'Всего ' + num(d.tot) + ' ед. за ' + usd(d.TC) + ', средняя = ' + num(d.TC) + ' ÷ ' + num(d.tot) + ' ≈ $' + avg.toFixed(2) + '. ';
  if (R.int(0,1) === 0){
    return withOpts({
      s: head + ' What is the cost of goods sold for the year (nearest $)?', x:{tbl:d.tbl},
      e: w + 'Продано ' + num(sold) + ' ед.: COGS = ' + num(sold) + ' × ' + avg.toFixed(2) + ' ≈ **' + usd(cogs) + '**. Средняя взвешивается по количеству, а не (' + d.c0 + ' + ' + d.c1 + ' + ' + d.c2 + ') ÷ 3.'
    }, opts(R, cogs, [d.TC - d.newQ.val, d.TC - d.oldQ.val, Math.round(sold * simple), cl], usd));
  }
  return withOpts({
    s: head + ' What is the value of closing inventory (nearest $)?', x:{tbl:d.tbl},
    e: w + 'Остаток ' + num(d.Q) + ' ед. × ' + avg.toFixed(2) + ' ≈ **' + usd(cl) + '**.'
  }, opts(R, cl, [d.newQ.val, d.oldQ.val, Math.round(d.Q * simple), cogs], usd));
}};

/* Depreciation: straight-line with monthly (part-year) charges */
GENS.sl = { t:'depr', f:function(R){
  var nm = R.pick(G_NAMES);
  var L = R.pick([4,5,6,8,10]), A = R.int(1,12)*1200, RV = R.pick([0,0,1000,2000,3000,5000]);
  var C = A*L + RV;
  var m = R.int(2,11), mo = 13 - m;
  var asset = R.pick(['a machine','a delivery van','a computer system','office equipment']);
  var base = nm + ' bought ' + asset + ' on 1 ' + G_MONTHS[m-1] + ' 2024 for ' + usd(C) + '. Its useful life is ' + L + ' years and its residual value is ' + (RV ? usd(RV) : 'nil') + '. Straight-line depreciation is charged for each month of ownership. The year end is 31 December.';
  var y1 = A*mo/12, acc = y1 + A;
  var annual = 'Annual = (' + num(C) + ' − ' + num(RV) + ') ÷ ' + L + ' = ' + usd(A) + '. ';
  var v = R.int(0,2);
  if (v === 0){
    return withOpts({
      s: base + ' What is the depreciation charge for 2024?',
      e: annual + 'В 2024 актив использовался ' + mo + ' мес. (с 1 ' + G_MONTHS[m-1] + ' по 31 December): ' + num(A) + ' × ' + mo + '/12 = **' + usd(y1) + '**.'
    }, opts(R, y1, [A, C/L*mo/12, A*(mo-1)/12, A*(mo+1)/12], usd));
  }
  if (v === 1){
    return withOpts({
      s: base + ' What is the accumulated depreciation at 31 December 2025?',
      e: annual + '2024: ' + mo + ' мес. = ' + usd(y1) + '; 2025: полный год ' + usd(A) + '. Accumulated = **' + usd(acc) + '**.'
    }, opts(R, acc, [2*A, y1, C/L*mo/12 + C/L, acc - A/12], usd));
  }
  var ca = C - acc;
  return withOpts({
    s: base + ' What is the carrying amount (net book value) at 31 December 2025?',
    e: annual + 'Accumulated = ' + usd(y1) + ' (' + mo + ' мес. в 2024) + ' + usd(A) + ' (2025) = ' + usd(acc) + '. Carrying amount = ' + num(C) + ' − ' + num(acc) + ' = **' + usd(ca) + '**.'
  }, opts(R, ca, [C - 2*A, C - RV - acc, acc, C - y1], usd));
}};

/* Depreciation: reducing balance */
GENS.rb = { t:'depr', f:function(R){
  var C = R.int(10,80)*1000, r = R.pick([20,25,30,40]), n = R.int(2,4);
  var f = 1 - r/100;
  var nbv = function(k){ return C * Math.pow(f, k); };
  var ch = function(k){ return nbv(k-1) * r / 100; };
  var asset = R.pick(['A delivery van','A lorry','A computer system','A machine']);
  var base = asset + ' costing ' + usd(C) + ' is depreciated using the reducing balance method at ' + r + '% per year, with a full year\'s charge in the year of purchase.';
  var chain = [];
  for (var k = 1; k <= n; k++) chain.push('Год ' + k + ': ' + num(nbv(k-1)) + ' × ' + r + '% = ' + num(ch(k)) + ', NBV ' + num(nbv(k)));
  if (R.int(0,1) === 0){
    return withOpts({
      s: base + ' What is the depreciation charge for year ' + n + ' (nearest $)?',
      e: chain.join('\n') + '\nCharge за год ' + n + ' = **' + usd(ch(n)) + '**. Процент применяют к NBV на начало года, а не к cost.'
    }, opts(R, Math.round(ch(n)), [C*r/100, ch(n-1), ch(n+1), nbv(n)].map(Math.round), usd));
  }
  return withOpts({
    s: base + ' What is the carrying amount (net book value) at the end of year ' + n + ' (nearest $)?',
    e: chain.join('\n') + '\nCarrying amount на конец года ' + n + ' = **' + usd(nbv(n)) + '**.'
  }, opts(R, Math.round(nbv(n)), [C - C*r/100*n, nbv(n-1), C - nbv(n), nbv(n+1)].map(Math.round), usd));
}};

/* Disposal: profit or loss on sale */
GENS.disp = { t:'depr', f:function(R){
  var L = R.pick([4,5,8,10]), A = R.int(2,12)*1000, C = A*L;
  var k = R.int(2, L-1), ca = C - A*k;
  var P = Math.max(500, Math.round(ca * (0.7 + R.r()*0.6) / 100) * 100);
  if (P === ca) P += 100;
  var res = P - ca;
  var asset = R.pick(['A machine','A vehicle','A printing press','A forklift truck']);
  return withOpts({
    s: asset + ' was bought on 1 January 20X1 for ' + usd(C) + '. It was depreciated on the straight-line basis over ' + L + ' years with no residual value. It was sold on 31 December 20X' + k + ' for ' + usd(P) + ', after ' + k + ' full years of depreciation. What is the profit or loss on disposal?',
    e: 'Depreciation = ' + num(C) + ' ÷ ' + L + ' = ' + usd(A) + ' в год. Accumulated = ' + num(A) + ' × ' + k + ' = ' + usd(A*k) + '. Carrying amount = ' + num(C) + ' − ' + num(A*k) + ' = ' + usd(ca) + '. Proceeds − carrying amount = ' + num(P) + ' − ' + num(ca) + ' = **' + pl(res) + '**.'
  }, opts(R, res, [P - C, -res, P - (C - A*(k-1)), P - (C - A*(k+1))], pl, true));
}};

/* Irrecoverable debts and allowance for receivables */
GENS.allow = { t:'debts', f:function(R){
  var nm = R.pick(G_NAMES);
  var RB = R.int(40,200)*1000 + R.int(0,9)*100, W = R.int(5,40)*100, p = R.pick([2,3,4,5]);
  var A1 = Math.round((RB - W) * p / 100);
  var A0 = Math.round(A1 * (0.7 + R.r()*0.6) / 10) * 10;

  return withOpts({ s: 'The trade payables account of ' + nm + "'s business for May is shown below (before balancing). What is the balance brought down on 1 June?", x:{tbl:tbl2}, e:e2 },

/* ---------- storage ---------- */

function fresh(){ return {v:1, updatedAt:0, q:{}, log:[], diag:[], mock:[], hist:[], read:{}, settings:{timer:true}, total:{n:0, c:0}, profile:{name:'', group:''}}; }

var S = normalize(lsGet(LS_STATE));

var route = {v:'home'};
var ui = {confirmFinish:false, confirmReset:false, explain:{}, ask:{}, editProfile:false, regErr:''};
var sampleFn = null;

/* ---------- account sync (per-person db doc) with browser fallback ---------- */
var sync = {ref:null, mode:'pending', busy:false, dirty:false, timer:null, retried:false};

function setSync(m){ sync.mode = m; var el = document.getElementById('sync'); if (el) el.outerHTML = syncChip(); }

/* ---------- questions ---------- */
var genCache = {};

  var key = g + ':' + seed;
  if (genCache[key]) return genCache[key];

  var r = G.f(mkR(seed));

function stripTags(h){ return String(h).replace(/<[^>]+>/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/\s+/g, ' ').trim(); }

function errText(code){
  if (code === 'cancelled') return '';

  if (HIDE_CODES.indexOf(code) >= 0) return 'Объяснения Claude недоступны на этой странице.';

function runSample(st, prompt, opts, paint){

  sampleFn(prompt, opts).then(function(res){ st.text = res.text; if (res.truncated) st.err = 'Ответ обрезан по длине.'; })
    .catch(function(e){

  h += '<header class="topic-h"><div class="eyebrow">Мой кабинет</div><h1>' + esc(p.name || 'Без имени') + '</h1>' +

       (ui.editProfile ? '' : '<div class="row">' + btn('edit-profile', 'Изменить имя и группу', null, 'small ghost') + '</div>') + '</header>';
  if (ui.editProfile || !p.name) h += regCard(p);
  h += '<p class="note">' + (sync.mode === 'cloud'
    ? 'История сохраняется в твоём аккаунте Claude: она будет на любом устройстве, где ты войдёшь в Claude и откроешь тренажёр.'
    : 'История сохраняется на этом устройстве, в этом браузере. На другом устройстве её не будет, а если очистить данные браузера, она пропадёт.') + '</p>';
  var mocks = S.hist.filter(function(e){ return e.mode === 'mock' && e.n === 20; });
  var best = mocks.reduce(function(b, e){ return !b || e.c > b.c ? e : b; }, null);
  h += '<section class="stats">' + stat('Готовность', pct(readiness())) + stat('Ответов', S.total.n) +
       stat('Верных', S.total.n ? pct(S.total.c / S.total.n) : '—') + stat('Лучший пробный', best ? best.c * 3 + '/60' : '—') + '</section>';
  h += '<section class="sheet"><div class="sheet-h"><h2>История результатов</h2>' + btn('copy-progress', 'Скопировать мой прогресс', null, 'small ghost') + '</div>' +
       (S.hist.length ? '<p class="muted small">Пройдено тестов: ' + S.hist.length + '</p><ul class="hist">' + S.hist.slice().reverse().map(histRow).join('') + '</ul>'
                      : '<p class="muted">Пока пусто. Пройди диагностику или любую тренировку, и результат появится здесь.</p>') + '</section>';
  h += '<div class="row">' + btn('home', 'К темам и тестам') + (S.hist.length ? '' : btn('start-diag', 'Начать диагностику', null, 'ghost')) + '</div>';
  h += '<p class="byline foot">' + AUTHOR + '</p>';
  return h;
}

function viewTopic(t){
  var T = TMAP[t], L = LESSONS[t], s = topicStats(t), misN = mistakeIds(t).length;
  var h = '<nav class="crumbs"><button class="link" data-act="home">← Все темы</button></nav>';
  h += '<header class="topic-h"><div class="eyebrow">Тема ' + T.n + ' · ' + esc(T.lec) + '</div><h1>' + esc(T.ru) + '</h1><p class="en">' + esc(T.en) + '</p>' +
       '<div class="row">' + chip(s.m) + '<span class="muted small">' + (s.m === null ? 'ещё нет ответов' : 'освоено ' + pct(s.m) + ' по последним ' + s.n + ' ответам') + '</span></div></header>';
  var cta = '<div class="row">' + btn('start-topic', 'Тренировка: 10 вопросов', t) + (misN ? btn('start-topic-mis', 'Мои ошибки по теме (' + misN + ')', t, 'ghost') : '') + '</div>';
  h += cta;
  h += '<article class="sheet lesson"><p class="lead">' + esc(L.lead) + '</p>' + L.sections.map(function(sec){ return '<section><h2>' + esc(sec.h) + '</h2>' + sec.html + '</section>'; }).join('') + '</article>';
  if (sampleFn){
    var st = ui.ask[t];
    h += '<section class="sheet ask"><h2>Спросить Claude по теме</h2><p class="muted small">Ответ придёт на русском. Запрос идёт от твоего аккаунта и тратит твой лимит сообщений.</p>' +
         '<label class="sr" for="ask-input">Твой вопрос</label><textarea id="ask-input" rows="3" placeholder="Например: почему allowance for receivables — это не liability?">' + esc(st ? st.q : '') + '</textarea>' +
         '<div class="row">' + '<button class="btn" id="ask-btn" data-act="ask" data-arg="' + t + '"' + (st && st.busy ? ' disabled' : '') + '>Спросить</button></div><div id="ask-out">' + aiBox(st, 'stop-ask', t) + '</div></section>';
  }
  h += cta;
  return h;
}

function viewQuiz(){
  var s = sess, i = s.i, n = s.ids.length, q = getQ(s.ids[i]), perm = s.perm[i];
  var exam = isExam(), chosen = s.ans[i], checked = !exam && s.chk[i], corr = perm.indexOf(q.a), T = TMAP[q.t];
  var left = s.limit ? Math.max(0, s.limit - Math.floor((Date.now() - s.start) / 1000)) : null;
  var h = '<div class="qbar"><button class="link" data-act="quit">← Выйти</button><div class="qtitle">' + esc(s.title) + (s.topic ? ' · ' + esc(TMAP[s.topic].ru) : '') + '</div>' +
          '<div class="qmeta"><span>' + (i + 1) + '/' + n + '</span>' + (left != null ? '<span id="timer"' + (left < 300 ? ' class="low"' : '') + '>' + mmss(left) + '</span>' : '') + '</div></div>';
  var done = exam ? s.ans.filter(function(a){ return a != null; }).length : s.chk.filter(Boolean).length;
  h += '<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="' + n + '" aria-valuenow="' + done + '"><span style="width:' + Math.round(done / n * 100) + '%"></span></div>';
  if (exam){
    h += '<nav class="pal" aria-label="Вопросы">' + s.ids.map(function(_, k){ return '<button data-act="jump" data-arg="' + k + '" class="' + (s.ans[k] != null ? 'done' : '') + (k === i ? ' cur' : '') + '" aria-label="Вопрос ' + (k + 1) + '">' + (k + 1) + '</button>'; }).join('') + '</nav>';
  }
  h += '<article class="qcard"><div class="qtags"><span class="tag">' + T.n + '. ' + esc(T.ru) + '</span>' + srcTag(q) + dots(q.d) + '<button class="link report" data-act="report" data-arg="p-' + i + '">Ошибка в вопросе?</button></div>' +
       '<div class="qstem">' + md(q.s) + '</div>' + qTable(q.x) + '<div class="opts">';
  perm.forEach(function(oi, k){
    var cls = 'opt';
    if (checked){ if (k === corr) cls += ' right'; else if (k === chosen) cls += ' wrong'; }
    else if (k === chosen) cls += ' sel';
    h += '<button class="' + cls + '" data-act="opt" data-arg="' + k + '"' + (checked ? ' disabled' : '') + ' aria-pressed="' + (k === chosen) + '"><span class="ol">' + LETTERS[k] + '</span><span class="ot">' + esc(q.o[oi]) + '</span></button>';
  });
  h += '</div>';
  if (checked){
    var ok = chosen === corr, key = 'p-' + i;
    h += '<div class="fb ' + (ok ? 'ok' : 'bad') + '"><div class="fb-h">' + (ok ? 'Верно' : 'Неверно. Правильный ответ: ' + LETTERS[corr]) + '</div>' + md(q.e) +
         (sampleFn ? '<div class="row">' + btn('explain', 'Объяснить подробнее', key, 'small ghost') + '</div>' : '') +
         '<div id="exp-' + key + '">' + aiBox(ui.explain[key], 'stop-explain', key) + '</div></div>';
  }
  h += '</article>';
  if (exam){
    h += '<div class="qnav"><div class="row">' + '<button class="btn ghost" data-act="prev"' + (i === 0 ? ' disabled' : '') + '>← Назад</button>' +
         (i < n - 1 ? btn('next', 'Дальше →') : btn('finish-ask', 'Завершить тест')) + '</div>' +
         (i < n - 1 ? '<button class="link" data-act="finish-ask">Завершить тест</button>' : '') + '</div>';
    if (ui.confirmFinish){
      var un = s.ans.filter(function(a){ return a == null; }).length;
      h += '<div class="confirm"><p>' + (un ? 'Без ответа: ' + un + ' ' + plural(un, 'вопрос', 'вопроса', 'вопросов') + '. Они будут засчитаны как неверные. ' : 'Ответы даны на все вопросы. ') + 'Завершить и посмотреть результат?</p><div class="row">' + btn('finish-yes', 'Завершить') + btn('finish-no', 'Вернуться к вопросам', null, 'ghost') + '</div></div>';
    }
    h += '<p class="muted small kbd">Клавиши: 1–4 или A–D выбрать ответ, ← → листать вопросы.</p>';
  } else {
    h += '<div class="qnav"><div class="row">' + (checked ? btn('next', i < n - 1 ? 'Дальше →' : 'Результаты →') : '<button class="btn" data-act="submit"' + (chosen == null ? ' disabled' : '') + '>Ответить</button>') + '</div></div>';
    h += '<p class="muted small kbd">Клавиши: 1–4 или A–D выбрать ответ, Enter ответить и перейти дальше.</p>';
  }
  return h;
}

function viewResults(){
  var r = last;
  if (!r) return viewHome();
  var h = '<nav class="crumbs"><button class="link" data-act="home">← На главную</button></nav>';
  var p = r.n ? r.c / r.n : 0;
  h += '<header class="res-h"><div class="eyebrow">' + esc(r.title) + (r.topic ? ' · ' + esc(TMAP[r.topic].ru) : '') + ' · ' + fmtDate(r.ts) + '</div>' +
       '<div class="score">' + r.c + '<span>/' + r.n + '</span></div><p>' + pct(p) + ' верных ответов' + (r.mode === 'mock' && r.n === 20 ? ', это <b>' + r.c * 3 + ' из 60</b> баллов за Section A' : '') + '.</p>' +
       '<div class="row">' + btn('copy-result', 'Скопировать результат', null, 'small ghost') + '</div></header>';
  var topics = Object.keys(r.by).sort(function(a, b){ return r.by[a][0] / r.by[a][1] - r.by[b][0] / r.by[b][1]; });
  h += '<section class="sheet"><h2>По темам</h2><div class="tw"><table class="tbt"><thead><tr><th>Тема</th><th class="r">Верно</th></tr></thead><tbody>' +
       topics.map(function(t){ var b = r.by[t], m = b[0] / b[1]; return '<tr data-act="topic" data-arg="' + t + '" tabindex="0"><td class="tn"><b>' + esc(TMAP[t].ru) + '</b></td><td class="r">' + b[0] + '/' + b[1] + bar(m) + '</td></tr>'; }).join('') +
       '</tbody></table></div></section>';
  var weak = topics.filter(function(t){ return r.by[t][0] / r.by[t][1] < 0.67; }).slice(0, 4);
  if (weak.length){
    h += '<section class="sheet"><h2>Что подтянуть</h2><ul class="todo">' + weak.map(function(t){ return '<li><span>' + esc(TMAP[t].ru) + '</span><span class="row">' + btn('topic', 'Урок', t, 'small ghost') + btn('start-topic', 'Тренировка', t, 'small') + '</span></li>'; }).join('') + '</ul></section>';
  } else if (r.n >= 5){
    h += '<section class="sheet"><h2>Отличный результат</h2><p>Слабых тем в этом тесте нет. Продолжай с тренировкой по слабым местам или пробным экзаменом.</p><div class="row">' + btn('start-mixed', 'Тренировка по слабым местам') + btn('start-mock', 'Пробный экзамен', null, 'ghost') + '</div></section>';
  }
  h += '<section class="review"><h2>Разбор</h2>' + r.items.map(function(it, k){
    var q = getQ(it.id); if (!q) return '';
    var corr = it.perm.indexOf(q.a), key = 'r-' + k;
    var opts = it.perm.map(function(oi, j){ var cls = 'ro' + (j === corr ? ' right' : (j === it.ans ? ' wrong' : '')); return '<li class="' + cls + '"><span class="ol">' + LETTERS[j] + '</span><span>' + esc(q.o[oi]) + '</span></li>'; }).join('');
    var snippet = q.s.split('\n')[0];
    return '<details class="ri ' + (it.ok ? 'ok' : 'bad') + '"' + (it.ok ? '' : ' open') + '><summary><span class="mk">' + (it.ok ? '✓' : '✗') + ' ' + (k + 1) + '</span><span class="sn">' + esc(snippet) + '</span></summary><div class="ri-b">' +
      '<div class="qtags"><span class="tag">' + esc(TMAP[q.t].ru) + '</span>' + srcTag(q) + '<button class="link report" data-act="report" data-arg="r-' + k + '">Ошибка в вопросе?</button></div><div class="qstem">' + md(q.s) + '</div>' + qTable(q.x) + '<ul class="ropts">' + opts + '</ul>' +
      (it.ans == null ? '<p class="muted small">Без ответа.</p>' : '') + '<div class="fb ' + (it.ok ? 'ok' : 'bad') + '">' + md(q.e) +
      (sampleFn ? '<div class="row">' + btn('explain', 'Объяснить подробнее', key, 'small ghost') + '</div>' : '') + '<div id="exp-' + key + '">' + aiBox(ui.explain[key], 'stop-explain', key) + '</div></div></div></details>';
  }).join('') + '</section>';
  h += '<div class="row">' + btn('home', 'На главную') + (mistakeIds().length ? btn('start-mistakes', 'Работа над ошибками', null, 'ghost') : '') + '</div>';
  return h;
}

/* ---------- render & routing ---------- */
var app = document.getElementById('app');
var renderedKey = '';
var TYPED = ['reg-name', 'reg-group', 'ask-input'];
function render(){
  /* keep what the person is typing when a background update re-renders the same screen */
  var key = route.v + ':' + (route.t || ''), keep = {};
  if (key === renderedKey) TYPED.forEach(function(id){ var el = document.getElementById(id); if (el) keep[id] = {v:el.value, f:document.activeElement === el, s:el.selectionStart}; });
  var html;
  if (route.v === 'quiz' && sess) html = viewQuiz();
  else if (route.v === 'topic' && TMAP[route.t]) html = viewTopic(route.t);
  else if (route.v === 'results' && last) html = viewResults();
  else if (route.v === 'account') html = viewAccount();
  else { route = {v:'home'}; html = viewHome(); }
  app.innerHTML = html;
  app.setAttribute('data-view', route.v);
  renderedKey = route.v + ':' + (route.t || '');
  Object.keys(keep).forEach(function(id){
    var el = document.getElementById(id); if (!el) return;
    el.value = keep[id].v;
    if (keep[id].f){ el.focus(); try { el.setSelectionRange(keep[id].s, keep[id].s); } catch (e){} }
  });
}
function go(v, t){
  route = {v:v, t:t}; ui.confirmFinish = false; ui.confirmReset = false;
  render();
  try { window.scrollTo(0, 0); } catch (e){}
}
function scrollQuizTop(){ try { window.scrollTo(0, 0); } catch (e){} }

var ACT = {
  home: function(){ go('home'); },
  account: function(){ go('account'); },
  topic: function(t){ if (!TMAP[t]) return; S.read[t] = Date.now(); save(); go('topic', t); },
  results: function(){ if (last) go('results'); },
  'start-diag': function(){ startSession('diag', pickDiag()); },
  'start-mock': function(){ startSession('mock', pickMock()); },
  'start-mixed': function(){ startSession('mixed', pickMixed(10)); },
  'start-mistakes': function(){ startSession('mistakes', mistakeIds().slice(0, 15)); },
  'start-revision': function(){ startSession('revision', shuffle(BANK.filter(function(q){ return q.src === 'rev'; }).map(function(q){ return q.id; }))); },
  'start-topic': function(t){ startSession('practice', pickPractice(t, 10), {topic:t}); },
  'start-topic-mis': function(t){ startSession('mistakes', mistakeIds(t).slice(0, 15), {topic:t}); },
  resume: function(){ if (sess) go('quiz'); },
  discard: function(){ sess = null; saveSess(); render(); },
  opt: function(k){
    if (!sess) return;
    if (!isExam() && sess.chk[sess.i]) return;
    sess.ans[sess.i] = Number(k); saveSess(); render();
  },
  submit: function(){
    if (!sess || isExam()) return;
    var i = sess.i; if (sess.chk[i] || sess.ans[i] == null) return;
    var q = getQ(sess.ids[i]);
    sess.chk[i] = true;
    record(q, sess.ans[i] === sess.perm[i].indexOf(q.a));
    save(); saveSess(); render();
  },
  next: function(){
    if (!sess) return;
    if (!isExam() && !sess.chk[sess.i]) return;
    if (sess.i >= sess.ids.length - 1){ if (isExam()){ ui.confirmFinish = true; render(); } else finishSession(); return; }
    sess.i++; ui.confirmFinish = false; saveSess(); render(); scrollQuizTop();
  },
  prev: function(){ if (sess && isExam() && sess.i > 0){ sess.i--; saveSess(); render(); scrollQuizTop(); } },
  jump: function(k){ if (sess && isExam()){ sess.i = Math.max(0, Math.min(sess.ids.length - 1, Number(k))); saveSess(); render(); } },
  'finish-ask': function(){ ui.confirmFinish = true; render(); },
  'finish-yes': function(){ finishSession(); },
  'finish-no': function(){ ui.confirmFinish = false; render(); },
  quit: function(){ saveSess(); go('home'); },
  explain: function(key){
    if (!sampleFn) return;
    var tg = explainTarget(key); if (!tg || !tg.q) return;
    var st = ui.explain[key] || (ui.explain[key] = {});
    if (st.busy) return;
    runSample(st, explainPrompt(tg.q, tg.perm, tg.chosen), {modelTier:'quick'}, function(){ paintExplain(key); });
  },
  'stop-explain': function(key){ var st = ui.explain[key]; if (st && st.ctl) st.ctl.abort(); },
  ask: function(t){
    if (!sampleFn) return;
    var inp = document.getElementById('ask-input'), qt = inp ? inp.value.trim() : '';
    if (!qt) return;
    var st = ui.ask[t] || (ui.ask[t] = {});
    if (st.busy) return;
    st.q = qt;
    runSample(st, askPrompt(t, qt), {cache:false}, function(){ paintAsk(t); });
  },
  'stop-ask': function(t){ var st = ui.ask[t]; if (st && st.ctl) st.ctl.abort(); },
  'toggle-timer': function(){ S.settings.timer = !S.settings.timer; save(); render(); },
  'reset-ask': function(){ ui.confirmReset = true; render(); },
  'reset-no': function(){ ui.confirmReset = false; render(); },
  'reset-yes': function(){
    var keepProfile = S.profile;
    S = fresh(); if (keepProfile) S.profile = keepProfile;
    sess = null; last = null; saveSess(); lsDel(LS_LAST);
    ui = {confirmFinish:false, confirmReset:false, explain:{}, ask:{}, editProfile:false, regErr:''};
    save(); go('home');
  },
  register: function(){
    var n = document.getElementById('reg-name'), g = document.getElementById('reg-group');
    var name = n ? n.value.replace(/\s+/g, ' ').trim().slice(0, 40) : '';
    var group = g ? g.value.replace(/\s+/g, ' ').trim().slice(0, 20) : '';
    if (!name){ ui.regErr = 'Напиши имя, чтобы продолжить.'; render(); var el = document.getElementById('reg-name'); if (el) el.focus(); return; }
    var first = !(S.profile && S.profile.name);
    S.profile = {name:name, group:group}; ui.regErr = ''; ui.editProfile = false;
    save(); render();
    toast(first ? 'Готово, ' + name + '! Начни с диагностики.' : 'Профиль сохранён.');
  },
  'edit-profile': function(){ ui.editProfile = true; render(); var el = document.getElementById('reg-name'); if (el) el.focus(); },
  'cancel-profile': function(){ ui.editProfile = false; ui.regErr = ''; render(); },
  'copy-result': function(){ if (last) copyText(summaryText('result'), 'Результат скопирован. Отправь его автору тренажёра или в чат группы.'); },
  'copy-progress': function(){ copyText(summaryText('progress'), 'Прогресс скопирован.'); },
  report: function(key){
    var tg = explainTarget(key); if (!tg || !tg.q) return;
    copyText(reportText(tg), 'Скопировано. Допиши, что не так, и отправь автору тренажёра.');
  }
};

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el || !app.contains(el) || el.disabled) return;
  var fn = ACT[el.getAttribute('data-act')];
  if (fn){ e.preventDefault(); fn(el.getAttribute('data-arg')); }
});
document.addEventListener('keydown', function(e){
  var tag = (e.target && e.target.tagName) || '';
  if (tag === 'TEXTAREA' || tag === 'INPUT') {
    if (tag === 'TEXTAREA' && e.key === 'Enter' && (e.ctrlKey || e.metaKey) && route.v === 'topic'){ e.preventDefault(); ACT.ask(route.t); }
    if (tag === 'INPUT' && e.key === 'Enter' && /^reg-/.test(e.target.id || '')){ e.preventDefault(); ACT.register(); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Enter' && e.target && e.target.matches && e.target.matches('tr[data-act]')){ e.preventDefault(); ACT[e.target.getAttribute('data-act')](e.target.getAttribute('data-arg')); return; }
  if (route.v !== 'quiz' || !sess) return;
  var k = e.key.toLowerCase(), map = {'1':0, '2':1, '3':2, '4':3, 'a':0, 'b':1, 'c':2, 'd':3};
  if (map.hasOwnProperty(k)){ ACT.opt(String(map[k])); e.preventDefault(); return; }
  if (k === 'enter'){
    if (tag === 'BUTTON') return;
    e.preventDefault();
    if (isExam()) ACT.next();
    else if (sess.chk[sess.i]) ACT.next();
    else ACT.submit();
  } else if (k === 'arrowright' && isExam()) ACT.next();
  else if (k === 'arrowleft' && isExam()) ACT.prev();
});

setInterval(function(){
  if (route.v !== 'quiz' || !sess || !sess.limit) return;
  var left = sess.limit - Math.floor((Date.now() - sess.start) / 1000);
  if (left <= 0){ finishSession(); return; }
  var el = document.getElementById('timer');
  if (el){ el.textContent = mmss(left); if (left < 300) el.className = 'low'; }
}, 1000);

render();
initSync();
initSample();
})();
</script>
