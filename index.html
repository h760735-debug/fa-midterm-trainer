<style>
/* Layout: a bookkeeper's ledger. Each screen is a ruled sheet on green ledger paper; the topic list
   reads like a trial balance closed with a double rule; answers are marked in blue ink, corrections in red. */
:root{
  --paper:#EBF1EA; --sheet:#FBFCFA; --rule:#D3DFD1; --rule-2:#ABBFAA;
  --ink:#17221C; --muted:#53635A; --accent:#2B4C9B; --on-accent:#FFFFFF; --accent-soft:#E1E8F6;
  --good:#1B7544; --good-bg:#DFF0E5; --mid:#935A08; --mid-bg:#F4EAD6; --bad:#B0261E; --bad-bg:#F8E1DE; --none:#6A7870; --none-bg:#E2E9E2;
  --f-display:'PT Serif', Georgia, 'Times New Roman', serif;
  --f-body:'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1512; --sheet:#151C18; --rule:#26322B; --rule-2:#3C4D43;
    --ink:#E2EBE5; --muted:#9AABA1; --accent:#A6BAFF; --on-accent:#0E1430; --accent-soft:#1C2643;
    --good:#72CD9A; --good-bg:#14291D; --mid:#E5B65A; --mid-bg:#2C2413; --bad:#F38F84; --bad-bg:#351A17; --none:#8D9991; --none-bg:#1E2621;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1512; --sheet:#151C18; --rule:#26322B; --rule-2:#3C4D43;
  --ink:#E2EBE5; --muted:#9AABA1; --accent:#A6BAFF; --on-accent:#0E1430; --accent-soft:#1C2643;
  --good:#72CD9A; --good-bg:#14291D; --mid:#E5B65A; --mid-bg:#2C2413; --bad:#F38F84; --bad-bg:#351A17; --none:#8D9991; --none-bg:#1E2621;
  color-scheme:dark;
}
*{ box-sizing:border-box; }
[hidden]{ display:none !important; }
body{ background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
.wrap{ max-width:820px; margin:0 auto; padding-inline:16px; padding-block:20px 72px; display:flex; flex-direction:column; gap:18px; }
h1, h2{ font-family:var(--f-display); font-weight:700; text-wrap:balance; margin:0; }
h1{ font-size:clamp(1.75rem, 5vw, 2.3rem); line-height:1.12; }
h2{ font-size:1.28rem; line-height:1.25; }
p{ margin:0; }
b{ font-weight:600; }
.eyebrow{ font-family:var(--f-mono); font-size:.72rem; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.muted{ color:var(--muted); }
.small{ font-size:.85rem; }
.mono{ font-family:var(--f-mono); font-variant-numeric:tabular-nums; }
.err{ color:var(--bad); font-size:.9rem; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }

/* buttons */
.btn{ appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:.4rem; border:1px solid var(--accent); background:var(--accent); color:var(--on-accent); font:600 .95rem/1.1 var(--f-body); padding:.75rem 1.1rem; border-radius:6px; cursor:pointer; min-height:44px; text-align:center; }
.btn:hover{ filter:brightness(1.08); }
.btn.ghost{ background:transparent; color:var(--accent); }
.btn.ghost:hover{ background:var(--accent-soft); filter:none; }
.btn.small{ min-height:36px; padding:.45rem .8rem; font-size:.875rem; }
.btn.danger{ background:var(--bad); border-color:var(--bad); color:var(--sheet); }
.btn:disabled{ opacity:.45; cursor:not-allowed; filter:none; }
.link{ appearance:none; background:none; border:0; color:var(--accent); font:500 .95rem var(--f-body); cursor:pointer; padding:.35rem 0; text-align:left; }
.link.danger{ color:var(--bad); }
.btn:focus-visible, .link:focus-visible, .opt:focus-visible, .tile:focus-visible, tr[data-act]:focus-visible, .pal button:focus-visible, summary:focus-visible, textarea:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

/* header */
.top{ display:grid; gap:6px; padding-top:4px; }
.top .sub{ color:var(--muted); }
.sync{ display:inline-flex; align-items:center; gap:.45rem; font-size:.8rem; color:var(--muted); margin-top:2px; }
.sync::before{ content:''; width:8px; height:8px; border-radius:50%; background:var(--none); flex:none; }
.sync-cloud::before{ background:var(--good); }
.sync-local::before{ background:var(--mid); }
.sync-err::before{ background:var(--bad); }

/* sheets */
.sheet{ background:var(--sheet); border:1px solid var(--rule); border-radius:var(--r); padding:18px; display:grid; gap:12px; min-width:0; }
.sheet-h{ display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline; justify-content:space-between; }
.next{ background:var(--sheet); border:1px solid var(--rule-2); border-radius:var(--r); padding:18px; display:grid; gap:10px; }
.next.resume{ border-color:var(--accent); }
.tw{ overflow-x:auto; -webkit-overflow-scrolling:touch; min-width:0; }

/* trial balance of topics */
.tbt{ width:100%; border-collapse:collapse; font-size:.95rem; }
.tbt th{ text-align:left; font:600 .7rem var(--f-mono); letter-spacing:.07em; text-transform:uppercase; color:var(--muted); padding:.45rem .45rem; border-bottom:1px solid var(--ink); }
.tbt td{ padding:.6rem .45rem; border-bottom:1px solid var(--rule); vertical-align:middle; }
.tbt tr[data-act]{ cursor:pointer; }
.tbt tr[data-act]:hover td{ background:var(--accent-soft); }
.tbt .num{ font-family:var(--f-mono); color:var(--muted); width:2.2rem; }
.tbt .tn b{ display:block; }
.tbt .tn > span{ display:block; color:var(--muted); font-size:.82rem; }
.tbt .r, .tbt th.r{ text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums; white-space:nowrap; width:7.5rem; }
.tbt tfoot td{ border-top:1px solid var(--ink); border-bottom:3px double var(--ink); font-weight:700; padding:.7rem .45rem; }
.tbt tfoot td.r{ font-size:1.05rem; }
.bonus-t{ margin-top:-4px; }
.bonus-t td{ border-bottom:0; color:var(--muted); }
.chip-inl{ display:none !important; }
.bar{ display:block; height:5px; background:var(--none-bg); border-radius:3px; overflow:hidden; margin-top:6px; margin-left:auto; width:100%; max-width:7rem; }
.bar > i{ display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .4s ease; }
.bar.weak > i{ background:var(--bad); } .bar.mid > i{ background:var(--mid); } .bar.good > i{ background:var(--good); }
.chip{ display:inline-flex; align-items:center; font:600 .74rem var(--f-body); padding:.18rem .55rem; border-radius:999px; white-space:nowrap; }
.chip.weak{ color:var(--bad); background:var(--bad-bg); }
.chip.mid{ color:var(--mid); background:var(--mid-bg); }
.chip.good{ color:var(--good); background:var(--good-bg); }
.chip.none{ color:var(--none); background:var(--none-bg); }

/* action tiles */
.actions{ display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:12px; }
.actions .tile{ grid-column:span 2; }
.actions .tile:nth-child(n+4){ grid-column:span 3; }
.tile{ appearance:none; text-align:left; background:var(--sheet); border:1px solid var(--rule); border-radius:var(--r); padding:14px; cursor:pointer; font:inherit; color:inherit; display:grid; align-content:start; gap:4px; min-height:104px; }
.tile:hover{ border-color:var(--accent); }
.tile:disabled{ cursor:default; opacity:.6; }
.tile:disabled:hover{ border-color:var(--rule); }
.tile .k{ font-family:var(--f-mono); font-size:.7rem; color:var(--accent); letter-spacing:.06em; text-transform:uppercase; }
.tile b{ font-size:1.02rem; }
.tile span:last-child{ color:var(--muted); font-size:.85rem; line-height:1.4; }

.hist{ list-style:none; margin:0; padding:0; }
.hist li{ display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; padding:.45rem 0; border-bottom:1px solid var(--rule); }
.hist li b{ margin-left:auto; }
.about summary{ cursor:pointer; font-family:var(--f-display); font-weight:700; font-size:1.12rem; }
.about-b{ display:grid; gap:10px; margin-top:10px; max-width:70ch; }
.about-b ol{ margin:0; padding-left:1.3rem; display:grid; gap:4px; }
.settings{ display:grid; gap:10px; padding-top:4px; border-top:1px solid var(--rule); }
.confirm{ border:1px solid var(--bad); background:var(--bad-bg); border-radius:6px; padding:12px; display:grid; gap:10px; }

/* sign-up, account, sharing */
.byline{ font-family:var(--f-display); font-style:italic; color:var(--muted); font-size:1.02rem; }
.byline.foot{ font-size:.9rem; padding-top:4px; }
.stats{ display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:12px; }
.stat{ background:var(--sheet); border:1px solid var(--rule); border-radius:var(--r); padding:12px 14px; display:grid; gap:4px; min-width:0; }
.stat b{ font-size:1.55rem; line-height:1.1; font-weight:600; }
.hist .hl{ font-weight:500; }
.hist .pc{ color:var(--muted); width:3.4rem; text-align:right; }
.hello{ font-size:.95rem; }
.hello .link{ padding:0; font-size:.9rem; }
.reg{ border-color:var(--accent); }
.reg .fields{ display:grid; grid-template-columns:minmax(0, 2fr) minmax(0, 1fr); gap:10px; }
.reg label{ display:grid; gap:4px; font-size:.85rem; color:var(--muted); }
.reg input{ font:inherit; font-size:1rem; color:var(--ink); background:var(--sheet); border:1px solid var(--rule-2); border-radius:6px; padding:.6rem .7rem; min-height:44px; width:100%; }
.reg input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
.qtags .report{ margin-left:auto; padding:0; font-size:.8rem; color:var(--muted); }
.qtags .report:hover{ color:var(--accent); }
.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom, 0px)); width:max-content; max-width:min(92vw, 520px); background:var(--ink); color:var(--paper); padding:.7rem 1rem; border-radius:6px; font-size:.9rem; line-height:1.4; z-index:20; box-shadow:0 6px 24px rgba(0, 0, 0, .18); }
.copybox{ position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); max-width:560px; margin:0 auto; background:var(--sheet); color:var(--ink); border:1px solid var(--rule-2); border-radius:var(--r); padding:14px; display:grid; gap:8px; z-index:21; box-shadow:0 10px 30px rgba(0, 0, 0, .2); }
.copybox textarea{ width:100%; font:.85rem/1.45 var(--f-mono); background:var(--paper); color:var(--ink); border:1px solid var(--rule-2); border-radius:6px; padding:.5rem .6rem; resize:vertical; }

/* topic page */
.crumbs{ margin-bottom:-6px; }
.topic-h{ display:grid; gap:6px; }
.topic-h .en{ color:var(--muted); font-style:italic; }
.lesson{ gap:0; }
.lesson .lead{ font-size:1.05rem; margin-bottom:14px; max-width:68ch; }
.lesson section{ border-top:1px solid var(--rule); padding-block:14px; display:grid; gap:8px; min-width:0; }
.lesson section:last-child{ padding-bottom:0; }
.lesson h2{ font-size:1.18rem; }
.lesson p, .lesson li{ max-width:70ch; }
.lesson ul, .lesson ol{ margin:0; padding-left:1.25rem; display:grid; gap:4px; }
.tbl, .qt, .gl{ border-collapse:collapse; width:100%; font-size:.92rem; }
.tbl th, .tbl td, .qt th, .qt td{ border-bottom:1px solid var(--rule); padding:.45rem .55rem; text-align:left; vertical-align:top; }
.tbl th, .qt th{ font-weight:600; background:var(--paper); }
.tbl td.n, .qt td.n{ text-align:right; font-family:var(--f-mono); font-size:.88rem; font-variant-numeric:tabular-nums; white-space:nowrap; }
.tbl.two td{ width:50%; }
.tacct td:nth-child(2){ border-right:2px solid var(--ink); }
.tbl.tacct tr.tot td, .qt.closed tbody tr:last-child td{ border-top:1px solid var(--ink); border-bottom:3px double var(--ink); font-weight:600; }
.formula{ font-family:var(--f-mono); font-size:.88rem; background:var(--paper); border:1px solid var(--rule-2); border-radius:6px; padding:.7rem .85rem; line-height:1.75; overflow-x:auto; }
.ex{ background:var(--accent-soft); border-radius:6px; padding:.7rem .85rem; font-size:.95rem; line-height:1.6; }
.trap{ background:var(--bad-bg); border-radius:6px; padding:.65rem .85rem; }
.trap::before{ content:'Внимание'; display:block; font:600 .7rem var(--f-mono); letter-spacing:.07em; text-transform:uppercase; color:var(--bad); margin-bottom:.3rem; }
.note{ color:var(--muted); font-size:.93rem; }
.gl td{ padding:.38rem .5rem; border-bottom:1px solid var(--rule); vertical-align:top; }
.gl td:first-child{ font-family:var(--f-mono); font-size:.84rem; width:46%; }
.org{ display:grid; gap:10px; }
.org-top, .org-row > div{ border:1px solid var(--rule-2); border-radius:6px; padding:.6rem .75rem; background:var(--sheet); }
.org-top{ border-color:var(--accent); }
.org span{ display:block; color:var(--muted); font-size:.88rem; }
.org-row{ display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; }
.ask textarea{ width:100%; min-height:76px; border:1px solid var(--rule-2); border-radius:6px; padding:.6rem .7rem; font:inherit; background:var(--sheet); color:var(--ink); resize:vertical; }
.ai{ border-top:1px dashed var(--rule-2); padding-top:10px; margin-top:4px; display:grid; gap:8px; }
.ai-h{ font:600 .7rem var(--f-mono); letter-spacing:.07em; text-transform:uppercase; color:var(--accent); }
.ai ul, .ai ol{ margin:0; padding-left:1.2rem; }

/* quiz */
.qbar{ position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--paper); display:flex; align-items:center; gap:12px; padding-block:8px; border-bottom:1px solid var(--rule); margin-block:-8px -6px; }
.qtitle{ flex:1; min-width:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.qmeta{ display:flex; gap:12px; font-family:var(--f-mono); font-size:.9rem; font-variant-numeric:tabular-nums; }
#timer.low, .qmeta .low{ color:var(--bad); font-weight:600; }
.prog{ height:4px; background:var(--rule); border-radius:2px; overflow:hidden; }
.prog > span{ display:block; height:100%; background:var(--accent); transition:width .3s ease; }
.pal{ display:flex; flex-wrap:wrap; gap:6px; }
.pal button{ width:34px; height:34px; border-radius:4px; border:1px solid var(--rule-2); background:var(--sheet); color:var(--ink); font:500 .8rem var(--f-mono); cursor:pointer; padding:0; }
.pal button.done{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.pal button.cur{ outline:2px solid var(--accent); outline-offset:1px; }
.qcard{ background:var(--sheet); border:1px solid var(--rule); border-radius:var(--r); padding:18px; display:grid; gap:14px; min-width:0; }
.qtags{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.tag{ font:500 .74rem var(--f-body); color:var(--muted); border:1px solid var(--rule-2); border-radius:999px; padding:.12rem .55rem; }
.tag.rev{ color:var(--accent); border-color:var(--accent); }
.dots{ font-size:.6rem; letter-spacing:2px; color:var(--muted); margin-left:2px; }
.dots .dim{ opacity:.3; }
.qstem{ font-size:1.05rem; line-height:1.6; display:grid; gap:4px; }
.opts{ display:grid; gap:10px; }
.opt{ appearance:none; display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%; background:var(--sheet); color:var(--ink); border:1px solid var(--rule-2); border-radius:6px; padding:.72rem .85rem; font:inherit; line-height:1.45; cursor:pointer; min-height:48px; }
.opt:hover:not([disabled]){ background:var(--accent-soft); }
.opt .ol{ flex:none; width:1.75rem; height:1.75rem; display:grid; place-items:center; border:1px solid var(--rule-2); border-radius:4px; font:600 .82rem var(--f-mono); }
.opt .ot{ flex:1; min-width:0; padding-top:.1rem; overflow-wrap:anywhere; }
.opt.sel{ border-color:var(--accent); background:var(--accent-soft); }
.opt.sel .ol{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.opt.right{ border-color:var(--good); background:var(--good-bg); }
.opt.right .ol{ background:var(--good); border-color:var(--good); color:var(--sheet); }
.opt.wrong{ border-color:var(--bad); background:var(--bad-bg); }
.opt.wrong .ol{ background:var(--bad); border-color:var(--bad); color:var(--sheet); }
.opt[disabled]{ cursor:default; }
.fb{ border-radius:6px; padding:12px 14px; border:1px solid; display:grid; gap:8px; }
.fb.ok{ border-color:var(--good); background:var(--good-bg); }
.fb.bad{ border-color:var(--bad); background:var(--bad-bg); }
.fb-h{ font-weight:700; }
.fb.ok .fb-h{ color:var(--good); } .fb.bad .fb-h{ color:var(--bad); }
.qnav{ display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center; }
.kbd{ display:none; }
@media (hover:hover) and (pointer:fine){ .kbd{ display:block; } }

/* results */
.res-h{ display:grid; gap:6px; }
.score{ font-family:var(--f-display); font-weight:700; font-size:clamp(2.6rem, 9vw, 3.6rem); line-height:1; font-variant-numeric:tabular-nums; }
.score span{ color:var(--muted); font-size:.55em; }
.todo{ list-style:none; margin:0; padding:0; }
.todo li{ display:flex; flex-wrap:wrap; gap:8px 12px; justify-content:space-between; align-items:center; padding:.55rem 0; border-bottom:1px solid var(--rule); }
.review{ display:grid; gap:10px; }
.ri{ border:1px solid var(--rule); border-radius:6px; background:var(--sheet); min-width:0; }
.ri summary{ padding:.7rem .85rem; cursor:pointer; display:flex; gap:10px; align-items:baseline; list-style:none; }
.ri summary::-webkit-details-marker{ display:none; }
.ri .mk{ font-family:var(--f-mono); font-weight:700; white-space:nowrap; }
.ri.ok .mk{ color:var(--good); } .ri.bad .mk{ color:var(--bad); }
.ri .sn{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
.ri-b{ padding:0 .85rem .9rem; display:grid; gap:10px; min-width:0; }
.ropts{ list-style:none; margin:0; padding:0; display:grid; gap:6px; }
.ropts li{ display:flex; gap:10px; align-items:flex-start; padding:.45rem .6rem; border:1px solid var(--rule); border-radius:6px; }
.ropts .ol{ font:600 .8rem var(--f-mono); width:1.2rem; flex:none; }
.ropts li.right{ border-color:var(--good); background:var(--good-bg); }
.ropts li.wrong{ border-color:var(--bad); background:var(--bad-bg); }

@media (max-width:560px){
  .col-status{ display:none; }
  .chip-inl{ display:block !important; margin-top:4px; }
  .sheet, .qcard, .next{ padding:14px; }
  .tbt .r, .tbt th.r{ width:5.2rem; }
  .reg .fields{ grid-template-columns:1fr; }
  .stats{ grid-template-columns:repeat(2, minmax(0, 1fr)); }
  .actions{ grid-template-columns:repeat(2, minmax(0, 1fr)); }
  .actions .tile, .actions .tile:nth-child(n+4){ grid-column:auto; }
  .actions .tile:last-child{ grid-column:span 2; min-height:0; }
}
@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; animation:none !important; }
}
</style>

<script>/* FA Midterm Trainer: course content (topics, lessons, question bank).
   Source: WIUT Financial Accounting 4ACCN008C lectures 1-5, seminars 1-5, workshops 1-5,
   Revision for Midterm, Kaplan/BPP study text chapters. */

LESSONS.concepts = {
lead:'10 концепций учёта и 6 качественных характеристик (QCs). В тесте обычно дают ситуацию, и нужно узнать концепцию по ключевым словам.',
sections:[
{h:'Концепции: узнай по ситуации', html:`<div class="tw"><table class="tbl">
<tr><th>Concept</th><th>Суть</th><th>Сигнал в вопросе</th></tr>
<tr><td><b>Business entity</b></td><td>бизнес отделён от владельца</td><td>owner takes goods, private car, owner's house</td></tr>
<tr><td><b>Money measurement</b></td><td>учитываем только то, что измеряется в деньгах</td><td>skilled staff, hiring or retirement of employees</td></tr>

{h:'Качественные характеристики (QCs)', html:`<p><b>Fundamental</b>:</p><ul>

]};

LESSONS.equation = {
lead:'Assets = Liabilities + Capital, как меняется капитал и как найти прибыль по изменению net assets. Типичные вопросы на 3 балла.',
sections:[
{h:'Уравнение', html:`<div class="formula">Assets = Liabilities + Capital<br>Net assets = Assets − Liabilities = Capital</div>
<div class="formula">Closing capital = Opening capital + Capital introduced + Profit − Drawings<br>(убыток вычитается вместо прибыли)</div>
<div class="formula">Profit = Closing net assets − Opening net assets − Capital introduced + Drawings</div>
<p>Прибыль и новый капитал <b>увеличивают</b> капитал; убыток и drawings <b>уменьшают</b>.</p>`},
{h:'Примеры из ревизии', html:`<div class="ex">Mansur: net assets на начало $128,000, на конец $184,000; новый капитал $50,000; drawings $48,000.<br>Profit = 184,000 − 128,000 − 50,000 + 48,000 = <b>$54,000 profit</b>.</div>
<div class="ex">Profit $35,400; новый капитал $10,200; товары для себя $6,000; net assets на начало $95,100.<br>Closing = 95,100 + 10,200 + 35,400 − 6,000 = <b>$134,700</b>.</div>`},
{h:'Как операции меняют уравнение', html:`<div class="tw"><table class="tbl">
<tr><th>Операция</th><th>Эффект</th></tr>
<tr><td>Владелец вносит деньги</td><td>Assets ↑, Capital ↑</td></tr>
<tr><td>Покупка товара в кредит</td><td>Assets ↑ (inventory), Liabilities ↑ (payables)</td></tr>
<tr><td>Покупка товара за деньги</td><td>Inventory ↑, Bank ↓ (итог 0)</td></tr>
<tr><td>Оплата расхода (rent, telephone)</td><td>Assets ↓, Capital ↓ (расход уменьшает прибыль)</td></tr>
<tr><td>Продажа товара с cost 450 за 650</td><td>Assets ↑ 200, Capital ↑ 200 (прибыль)</td></tr>
<tr><td>Оплата поставщику</td><td>Assets ↓, Liabilities ↓</td></tr>
<tr><td>Покупатель платит долг</td><td>Bank ↑, Receivables ↓ (итог 0)</td></tr>
<tr><td>Drawings (деньги или товар)</td><td>Assets ↓, Capital ↓</td></tr>
<tr><td>Владелец платит кредитору из личных денег</td><td>Liabilities ↓, Capital ↑</td></tr>
</table></div>`},
{h:'Доходы, расходы и «не-расходы»', html:`<p><b>Revenue / income</b>: sales, profit on sale of NCA, interest receivable, discounts received.</p>
<p><b>Expenses</b>: COGS, depreciation, loss on sale of NCA, discounts allowed, irrecoverable debts и увеличение allowance.</p>
<p><b>Ни то, ни другое</b>: capital introduced, полученный кредит, погашение кредита, drawings, покупка внеоборотного актива.</p>`},
{h:'Прибыль ≠ деньги', html:`<p>Бизнес может быть прибыльным, а денег в банке меньше, если покупатели платят <b>дольше</b> (растут receivables), куплены активы, погашен кредит, большие drawings или накоплены запасы.</p>
<div class="trap"><ul><li>Depreciation уменьшает прибыль, но <b>не</b> деньги.</li><li>Если <b>мы</b> дольше платим поставщикам, денег становится <b>больше</b>, а не меньше.</li><li>При расчёте прибыли capital introduced <b>вычитаем</b>, drawings <b>прибавляем</b>.</li></ul></div>`},
{h:'Словарь', html:gl([['net assets','чистые активы'],['capital introduced','дополнительный вклад владельца'],['drawings','изъятия'],['opening / closing capital','капитал на начало / на конец'],['discounts allowed','скидки, предоставленные покупателям'],['discounts received','скидки, полученные от поставщиков']])}
]};

LESSONS.errors = {
lead:'Шесть ошибок, которые trial balance не замечает, ошибки, из-за которых он не сходится, и suspense account.',

{h:'TB не сходится → suspense account', html:`<ul><li>Single-sided entry (записан только Dr или только Cr).</li><li>Dr и Cr на разные суммы (transposition только в одном счёте).</li><li>Два дебета или два кредита.</li><li>Ошибка сложения (casting) в счёте; сальдо пропущено в TB или стоит не на той стороне.</li></ul>
<p><b>Suspense account</b> — временный счёт: (1) на разницу в TB; (2) когда бухгалтер не знает, куда отнести одну из сторон. До составления отчётности он должен обнулиться.</p>

LESSONS.inventory = {
lead:'IAS 2: что входит в стоимость запасов, lower of cost and NRV, расчёт COGS и методы FIFO, LIFO, AVCO (periodic и perpetual).',
sections:[
{h:'IAS 2 коротко', html:`<ul><li><b>Inventory</b> — запасы для продажи, в производстве (WIP) или материалы для производства.</li><li>Оценка: <b>lower of cost and NRV</b>.</li><li><b>NRV</b> = estimated selling price − costs to complete and sell.</li></ul>
<div class="tw"><table class="tbl two">
<tr><th>Входит в cost</th><th>Не входит</th></tr>
<tr><td>цена покупки <b>минус trade discount</b>, import duties, транспорт до склада (carriage inwards, freight), direct labour и production overheads</td><td>selling costs, carriage <b>outwards</b>, хранение готовой продукции, abnormal wastage, administrative overheads</td></tr>
</table></div>`},
{h:'COGS и gross profit', html:`<div class="formula">COGS = Opening inventory + Purchases − Returns outwards + Carriage inwards − Closing inventory<br>Gross profit = Sales − COGS<br>Net profit = Gross profit + other income − expenses</div>
<div class="ex">Peter (лекция 4): 9,500 + 15,000 + 1,000 − 9,600 = <b>COGS 15,900</b>; GP = 20,000 − 15,900 = <b>4,100</b>.</div>
<div class="ex">Seminar 4: 3,000 + 45,000 − 5,000 − 4,000 = <b>COGS 39,000</b>; GP = 65,000 − 39,000 = <b>26,000</b>.</div>
<p>Проводки: opening inventory — Dr Cost of sales / Cr Inventory; closing inventory — <b>Dr Inventory / Cr Cost of sales</b>. Closing inventory в балансе — <b>current asset</b>.</p>`},
{h:'FIFO, LIFO, AVCO на одном примере', html:`<p>SS Ltd (Seminar 4): 20 т × $18; купили 48 т × $20, 15 т × $24, 10 т × $25. Всего 93 т = $1,930. Продали 60 т, остаток 33 т.</p>
<div class="tw"><table class="tbl">
<tr><th>Метод</th><th>Идея</th><th>COGS</th><th>Closing</th></tr>
<tr><td><b>FIFO</b></td><td>первыми уходят старые; в остатке новые</td><td class="n">20×18 + 40×20 = 1,160</td><td class="n">10×25 + 15×24 + 8×20 = 770</td></tr>
<tr><td><b>LIFO</b></td><td>первыми уходят новые; в остатке старые</td><td class="n">10×25 + 15×24 + 35×20 = 1,310</td><td class="n">20×18 + 13×20 = 620</td></tr>
<tr><td><b>AVCO</b></td><td>средняя взвешенная: total cost ÷ total units</td><td class="n">60 × 20.75 ≈ 1,245</td><td class="n">33 × 20.75 ≈ 685</td></tr>
</table></div>
<p>Проверка: COGS + closing = 1,930 при любом методе.</p>`},
{h:'Periodic vs perpetual', html:`<ul><li><b>Periodic</b>: COGS считают в конце периода после инвентаризации; AVCO — одна средняя на весь период.</li><li><b>Perpetual</b>: запасы и COGS обновляются после каждой покупки и продажи; AVCO пересчитывают после каждой покупки.</li><li><b>FIFO</b> даёт одинаковый результат в обеих системах; AVCO — разный (G.D. Company: periodic 4,146, perpetual 4,026).</li></ul>`},
{h:'Влияние метода на прибыль', html:`<p>При <b>росте цен</b>: FIFO → closing inventory выше → COGS ниже → <b>прибыль выше</b>. LIFO → наоборот. AVCO — посередине.</p>
<div class="trap"><ul><li><b>LIFO запрещён IAS 2</b>. Разрешены FIFO и AVCO.</li><li>AVCO — средняя, <b>взвешенная по количеству</b>, а не простое среднее цен.</li><li>Returns outwards <b>уменьшают</b> покупки; carriage outwards в COGS не входит.</li><li>Выбранный метод применяют каждый год — concept of <b>consistency</b>.</li></ul></div>`},
{h:'Словарь', html:gl([['inventory (stock)','запасы'],['cost of goods sold (COGS)','себестоимость продаж'],['net realisable value','чистая стоимость реализации'],['carriage inwards / outwards','доставка к нам / к покупателю'],['returns outwards','возвраты поставщикам'],['weighted average','средневзвешенная'],['periodic / perpetual','периодический / непрерывный учёт']])}
]};

{h:'Стоимость актива (IAS 16)', html:`<div class="tw"><table class="tbl two">
<tr><th>Капитализируем (capital expenditure)</th><th>Расход периода (revenue expenditure)</th></tr>
<tr><td>цена покупки, доставка, юридические услуги, установка и тестирование, улучшения, которые увеличивают выгоду (пристройка к магазину)</td><td>ремонт, покраска, обслуживание, обучение персонала, администрация, ежегодные сборы (road licence)</td></tr>
</table></div>
<div class="ex">Billie (Kaplan): здание 250,000 + legal fees 10,000 = <b>260,000</b> (покраска 300 — расход). Машины 116,000 + номера 210 + доставка 180 = <b>116,390</b> (road licence 480 — расход).</div>
<p>Проводка покупки: Dr Non-current asset / Cr Bank или Payables.</p>`},
{h:'Зачем амортизация', html:`<p>Актив приносит доход несколько лет, поэтому его стоимость <b>распределяют на срок полезного использования</b>: это <b>matching</b>. Амортизация не копит деньги на замену и не показывает рыночную стоимость.</p>
<p>Причины: <b>physical</b> (износ, ржавчина), <b>economic</b> (obsolescence — устаревание; inadequacy), <b>passage of time</b> (истекает срок права), <b>depletion</b> (истощение шахты, нефти).</p>`},
{h:'Straight-line', html:`<div class="formula">Annual depreciation = (Cost − Residual value) ÷ Useful life<br>Если дан процент: Cost × %. Если residual не дан, он равен 0.</div>
<div class="ex">Mead: (12,000 − 2,400) ÷ 4 = <b>2,400</b> в год.<br>ABC: (20,000 − 2,000) ÷ 4 = 4,500 в год = <b>375</b> в месяц; carrying amount после 1-го года 20,000 − 4,500 = <b>15,500</b>.</div>`},
{h:'Reducing balance', html:`<div class="formula">Charge = NBV на начало года × %   (NBV = Cost − Accumulated depreciation)<br>Residual value НЕ вычитают</div>
<div class="tw"><table class="tbl">
<tr><th>Год</th><th>NBV на начало</th><th>Charge 40%</th><th>NBV на конец</th></tr>
<tr><td>1</td><td class="n">5,000</td><td class="n">2,000</td><td class="n">3,000</td></tr>
<tr><td>2</td><td class="n">3,000</td><td class="n">1,200</td><td class="n">1,800</td></tr>
<tr><td>3</td><td class="n">1,800</td><td class="n">720</td><td class="n">1,080</td></tr>
<tr><td>4</td><td class="n">1,080</td><td class="n">432</td><td class="n">648</td></tr>
</table></div>
<p>Подходит, когда актив даёт больше пользы в первые годы (транспорт, компьютеры).</p>`},
{h:'По месяцам (part-year)', html:`<div class="ex">Laura (ревизия): машина 525,000, residual 5,000, 5 лет, куплена <b>1 March 2021</b>.<br>В год: 520,000 ÷ 5 = 104,000; в месяц 8,667.<br>2021: март–декабрь = <b>10 мес.</b> → 86,667. 2022: 104,000.<br>Accumulated на 31 Dec 2022 = <b>190,667</b>.</div>
<p class="note">Считай месяцы аккуратно: с 1 марта по 31 декабря — 10 месяцев; с 1 октября — 3.</p>`},
{h:'Проводка и баланс', html:`<div class="formula">Dr Depreciation expense (P&amp;L) / Cr Accumulated depreciation (SFP)</div>
<p>В балансе: Cost − Accumulated depreciation = <b>Carrying amount (NBV)</b>. Accumulated depreciation — контр-актив (кредитовое сальдо). Амортизация уменьшает прибыль, но не деньги.</p>
<p><b>Land</b> не амортизируется (неограниченный срок); здания амортизируются. Срок, residual и метод пересматривают каждый год; изменение — <b>change in accounting estimate</b> (IAS 8): оставшийся NBV делят на оставшийся срок.</p>`},
{h:'Выбытие (disposal)', html:`<div class="formula">Profit / (loss) on disposal = Proceeds − Carrying amount на дату продажи</div>
<div class="ex">Machine 3 (Seminar 5): cost 15,200, residual 5% = 760, 10 лет → 1,444 в год. Владели с 1 Oct 2018 по 30 Jun 2020 = 21 мес. → 2,527. NBV = 12,673. Продали за 12,640 → <b>loss 33</b>.</div>
<div class="trap"><ul><li>В reducing balance процент берут от <b>NBV</b>, а не от cost (кроме первого года).</li><li>Не забудь вычесть residual value в straight-line.</li><li>Цель амортизации — <b>spread the cost over useful life</b>, а не «funds for replacement».</li></ul></div>`},
{h:'Словарь', html:gl([['non-current asset','внеоборотный актив (основное средство)'],['residual (scrap) value','ликвидационная стоимость'],['useful life','срок полезного использования'],['accumulated depreciation','накопленная амортизация'],['carrying amount / NBV','балансовая (остаточная) стоимость'],['straight-line','линейный метод'],['reducing balance','метод уменьшаемого остатка'],['disposal','выбытие (продажа)']])}
]};

LESSONS.debts = {
lead:'Списание безнадёжных долгов, резерв по сомнительным долгам (allowance for receivables), изменение резерва и его влияние на прибыль.',
sections:[
{h:'Два вида проблемных долгов', html:`<ul><li><b>Irrecoverable (bad) debt</b> — точно не получим (банкротство, клиент исчез). <b>Списываем</b>.</li><li><b>Doubtful debt</b> — есть сомнения, но долг ещё не безнадёжен. Создаём <b>allowance</b> (резерв); долг остаётся в receivables.</li></ul>
<p>Концепция — <b>prudence</b>: не завышаем активы и прибыль.</p>`},
{h:'Проводки', html:`<div class="tw"><table class="tbl">
<tr><th>Ситуация</th><th>Проводка</th></tr>
<tr><td>Списать безнадёжный долг</td><td>Dr Irrecoverable debts expense / Cr Trade receivables</td></tr>
<tr><td>Создать или <b>увеличить</b> резерв</td><td>Dr Irrecoverable debts expense / Cr Allowance for receivables</td></tr>
<tr><td><b>Уменьшить</b> резерв</td><td>Dr Allowance for receivables / Cr Irrecoverable debts expense</td></tr>
<tr><td>Получили ранее списанный долг</td><td>Dr Cash / Cr Irrecoverable debts expense</td></tr>
</table></div>`},
{h:'В P&L идёт только изменение резерва', html:`<div class="formula">Change = New allowance − Old allowance<br>Total charge = Irrecoverable debts written off + Increase in allowance (− decrease)</div>
<ol><li>Сначала спиши безнадёжные долги.</li><li>Посчитай резерв от <b>оставшихся</b> receivables.</li><li>Сравни с резервом прошлого года: в P&amp;L только разница.</li><li>В балансе: Trade receivables − Allowance = net receivables (current assets).</li></ol>`},
{h:'Таблица из ревизии (2%)', html:`<div class="tw"><table class="tbl">
<tr><th>Год</th><th>Receivables</th><th>Allowance 2%</th><th>Изменение</th><th>Прибыль</th></tr>
<tr><td>2021</td><td class="n">77,000</td><td class="n">1,540</td><td class="n">+1,540</td><td>уменьшается</td></tr>
<tr><td>2022</td><td class="n">92,000</td><td class="n">1,840</td><td class="n">+300</td><td>уменьшается</td></tr>
<tr><td>2023</td><td class="n">86,000</td><td class="n">1,720</td><td class="n">−120</td><td>увеличивается</td></tr>
<tr><td>2024</td><td class="n">90,000</td><td class="n">1,800</td><td class="n">+80</td><td>уменьшается</td></tr>
</table></div>
<div class="ex">Seminar 5 MCQ: резерв был 20,000, списано 90,000, нужен резерв 24,000 → charge = 90,000 + 4,000 = <b>94,000</b>.</div>`},
{h:'Ageing schedule', html:`<p>Резерв можно оценить по возрасту долгов: до 1 мес. 5,000 × 1% = 50; 1–2 мес. 3,000 × 3% = 90; 2–3 мес. 800 × 4% = 32; 3–12 мес. 200 × 5% = 10; больше года 160 × 20% = 32. Итого <b>214</b>. Net receivables = 9,160 − 214 = <b>8,946</b>.</p>
<div class="trap"><ul><li>Allowance — <b>кредитовое</b> сальдо, вычитается из receivables; это не liability.</li><li>В P&amp;L идёт не весь резерв, а только <b>изменение</b>.</li><li>Процент считают <b>после</b> списания безнадёжных долгов.</li><li>Возврат списанного долга не восстанавливает receivables: Dr Cash / Cr Irrecoverable debts expense.</li></ul></div>`},
{h:'Словарь', html:gl([['irrecoverable (bad) debt','безнадёжный долг'],['doubtful debt','сомнительный долг'],['allowance for receivables','резерв по сомнительным долгам'],['write off','списать'],['ageing schedule','график по срокам задолженности'],['debt recovered','возврат списанного долга']])}
]};

LESSONS.accruals = {
lead:'Бонус-тема недели 6. В ревизии к мидтерму её нет: уточни у преподавателя, входит ли она в тест.',
sections:[
{h:'Идея', html:`<p>По концепции <b>accruals (matching)</b> расходы и доходы признают в периоде, к которому они относятся, а не когда движутся деньги.</p>
<div class="tw"><table class="tbl">
<tr><th>Ситуация</th><th>В балансе</th><th>Проводка</th></tr>
<tr><td><b>Accrued expense</b>: расход был, не оплачен</td><td>current liability</td><td>Dr Expense / Cr Accruals</td></tr>
<tr><td><b>Prepayment</b>: заплатили за будущий период</td><td>current asset</td><td>Dr Prepayments / Cr Expense</td></tr>
<tr><td><b>Accrued income</b>: заработали, деньги не получены</td><td>current asset</td><td>Dr Accrued income / Cr Income</td></tr>
<tr><td><b>Deferred income</b>: деньги получены вперёд</td><td>current liability</td><td>Dr Income / Cr Deferred income</td></tr>
</table></div>`},
{h:'Формула расхода', html:`<div class="formula">Expense = Paid − Opening accrual + Closing accrual + Opening prepayment − Closing prepayment</div>
<div class="ex">Электричество: оплачено 5,000; долг на начало 400, на конец 600 → 5,000 − 400 + 600 = <b>5,200</b>.<br>Аренда 12,000 за год оплачена 1 октября; год заканчивается 31 декабря → expense 3,000, prepayment 9,000.</div>
<div class="trap"><ul><li>Accrual увеличивает расход и создаёт обязательство; prepayment уменьшает расход и создаёт актив.</li><li>Не учли accrual → прибыль <b>завышена</b>, обязательства занижены.</li></ul></div>`}
]};

const BANK = [];
function Q(id, t, d, src, s, o, a, e, x){ BANK.push({id:id, t:t, d:d, src:src, s:s, o:o, a:a, e:e, x:x || null}); }

/* ---------- 1. Business & users ---------- */
Q("in01","intro",1,"rev","Which groups of people are most likely to be interested in the financial statements of a sole trader?\n1 Shareholders of the company\n2 The business's bank manager\n3 The tax authorities\n4 Financial analysts",
 ["1 and 2 only","2 and 3 only","2, 3 and 4 only","1, 2 and 3 only"],1,
 "У sole trader нет акционеров (shareholders), а финансовые аналитики обычно изучают публичные компании. Остаются **банк** (кредиты) и **налоговая** (налоги).");
Q("in02","intro",1,"rev","Identify the advantages of a limited liability company.\n1 Operating as a limited liability company makes raising finance easier because additional shares can be issued to raise additional cash.\n2 Operating as a limited liability company is more risky than operating as a sole trader because the shareholders are liable for all the debts of the business, whereas the sole trader is only liable for the debts up to the amount he has invested.",
 ["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],0,
 "1 верно: компания может выпустить новые акции. 2 перевёрнуто: у акционеров ответственность **ограничена** (limited liability), а у sole trader — **неограничена** (unlimited).");
Q("in03","intro",2,"sem1","Which of the following statements are FALSE for a partnership business?\n1 The partners' individual exposure to debt is limited.\n2 Financial statements for the partnership by law must be produced and made public.\n3 A partnership is not a separate legal entity from the partners themselves.",
 ["1 and 2 only","2 only","3 only","1 and 3 only"],0,
 "1 ложно: у партнёров unlimited liability (кроме LLP). 2 ложно: публиковать отчётность обязаны компании, а не партнёрства. 3 верно: партнёрство не отдельное юрлицо.");
Q("in04","intro",1,"sem1","Identify the users of financial statements.",
 ["Management of the company, investors, lenders, customers","Competitors, government, employees","Investment analysts, rating agencies, suppliers","All of the above"],3,
 "Все перечисленные группы — пользователи отчётности: внутренние (менеджмент) и внешние (инвесторы, кредиторы, клиенты, государство, сотрудники, аналитики, поставщики и даже конкуренты).");
Q("in05","intro",1,"lec1","Which of the following is an advantage of operating as a sole trader?",
 ["The owner has complete control over the business","The owner has limited liability for the debts of the business","Large amounts of finance can be raised by issuing shares","The business is a separate legal entity from its owner"],0,
 "Главный плюс sole trader — **полный контроль**. Ограниченная ответственность, выпуск акций и отдельное юрлицо — признаки limited company.");
Q("in06","intro",1,"lec1","A limited liability company becomes bankrupt. What is the maximum amount its shareholders can lose?",
 ["Only the amount they paid for their shares","All of their personal assets","The total debts of the company, shared equally","Nothing, because the directors are liable"],0,
 "Limited liability: долги компании отделены от личных долгов акционеров. Акционер теряет только то, что вложил в акции.");
Q("in07","intro",1,"new","Which user group is mainly interested in whether a business will be able to repay a loan and pay interest on time?",
 ["Lenders, such as banks","Employees","Competitors","Customers"],0,
 "Кредиторов (**lenders**) интересует платёжеспособность: вернут ли кредит и проценты.");
Q("in08","intro",1,"sem1","What is the main purpose of management accounting?",
 ["To provide information that helps managers plan, budget, control and make decisions","To prepare financial statements for shareholders in accordance with IFRS","To express an independent opinion on the financial statements","To prepare tax returns"],0,
 "Management accounting — для внутренних пользователей (менеджеров): планирование, бюджет, контроль. Второй вариант — financial accounting, третий — external audit, четвёртый — tax accounting.");
Q("in09","intro",2,"sem1","Which of the following describes financial accounting rather than management accounting?",
 ["Detailed reports on parts of the company, focused on the future","Reports mainly for external users, prepared under IFRS, focused on the past and audited annually","Internal reports which are not restricted by IFRS","Reports with no independent audit, prepared whenever managers need them"],1,
 "Financial accounting: внешние пользователи, IFRS, прошлое, ежегодный независимый аудит, сводные отчёты по компании в целом.");
Q("in10","intro",2,"lec1","Which of the following best describes an external audit?",
 ["The independent examination of, and expression of an opinion on, the financial statements of an enterprise","An appraisal activity established within an entity to evaluate its internal control systems","The preparation of the financial statements by the directors","The preparation and submission of the entity's tax return"],0,
 "External audit — независимая проверка отчётности и мнение о ней. Второй вариант описывает internal audit.");
Q("in11","intro",1,"lec1","The statement of financial position (balance sheet) shows:",
 ["The assets, liabilities and capital of a business at a particular date","The profit or loss made by a business over a period","The cash received and paid during a period","The sales of a business over a period"],0,
 "Statement of financial position — «снимок» на дату: активы, обязательства, капитал. Прибыль за период показывает statement of profit or loss.");
Q("in12","intro",1,"ws1","Which of the following is a liability of a business?",
 ["An amount owed to a wholesaler for inventory bought on credit","An amount owed by a customer who bought on credit","Inventory of finished goods awaiting sale","Petty cash held in the office"],0,
 "Долг поставщику (trade payable) — **обязательство**. Долг покупателя (trade receivable), запасы и наличные — активы.");
Q("in13","intro",2,"sem1","Dania started a business. She bought fixtures for $4,100, a van for $5,950 and inventory for $3,620. She has paid in full for the fixtures and the van, but still owes $1,670 for some of the inventory. M Johnson lent her $3,000. She now has $780 in the business bank account and $50 cash in hand. What are the total assets of the business?",
 ["$14,500","$9,830","$19,170","$13,720"],0,
 "Активы: 4,100 + 5,950 + 3,620 + 780 + 50 = **$14,500**. Обязательства: 1,670 + 3,000 = 4,670. Капитал = 14,500 − 4,670 = 9,830.");
Q("in14","intro",1,"ws1","Under the business entity concept, which of the following would NOT be recorded as an asset of Mr Brown's business?",
 ["Mr Brown's private house worth $300,000","Plant and machinery bought for the business for $4,000","A computer bought for the business for $5,000","Cash of $150,000 paid by Mr Brown into the business bank account"],0,
 "Личный дом владельца — **не** актив бизнеса: бизнес отделён от владельца (business entity). Остальное — активы бизнеса.");
Q("in15","intro",2,"zero","In its first month a cafe made sales of $25,000. It paid rent of $4,000, salaries of $7,000 and utilities of $2,000, and bought raw materials (all used) for $5,000. It also bought equipment for $30,000 using a $50,000 bank loan. What is the profit for the month?",
 ["$7,000 profit","$23,000 loss","$57,000 profit","$12,000 profit"],0,
 "Прибыль = доходы − расходы = 25,000 − (4,000 + 7,000 + 2,000 + 5,000) = **$7,000**. Оборудование — актив, а не расход; кредит — обязательство, а не доход.");
Q("in16","intro",1,"lec1","Which of the following is the best definition of a transaction?",
 ["An event, measurable in money, which changes the financial position of a business","Any conversation between a business and its customers","A list of balances taken from the ledger","A document sent to a customer requesting payment"],0,
 "Transaction — событие, измеримое в деньгах, которое меняет финансовое положение бизнеса (продажа, покупка, оплата).");
Q("in17","intro",1,"new","Which group of users would be most interested in information about job security and the ability of the business to pay wages?",
 ["Employees","Lenders","Tax authorities","Competitors"],0,
 "Сотрудники (**employees**) смотрят на стабильность бизнеса и его способность платить зарплату.");
Q("in18","intro",2,"rev","Which of the following is a weakness of a corporation (limited company) compared with a sole proprietorship?",
 ["It is subject to greater government regulation and must disclose its financial results","Its owners have unlimited liability for the business's debts","It is dissolved when one of the owners dies","It finds it more difficult to raise finance"],0,
 "Минусы компании: больше регулирования, затраты на создание, обязательная публикация результатов, двойное налогообложение. Unlimited liability и распад при смерти владельца — минусы sole trader и partnership.");

Q("rg09","reg",2,"lec1","Directors are responsible for which of the following?\n1 Preparing the financial statements in accordance with the applicable financial reporting framework (e.g. IFRS)\n2 The internal controls needed for financial statements to be free from material misstatement, whether due to fraud or error\n3 The prevention and detection of fraud",
